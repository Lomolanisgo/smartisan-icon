  <!-- bow tie -->
  <path d="M128 168L110 159V179Z M128 168L146 159V179Z" fill="#111111"/>
  <rect x="123" y="163" width="10" height="10" rx="2" fill="#111111"/>
  <text x="128" y="214" text-anchor="middle" font-family="Segoe UI Black, Segoe UI, sans-serif" font-weight="900" font-style="italic" font-size="36" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#111111">KFC</text>
</svg>
