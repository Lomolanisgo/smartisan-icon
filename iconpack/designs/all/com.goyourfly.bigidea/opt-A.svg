  <path d="M128 38 C166 38 194 66 194 104 C194 130 180 144 168 160 C162 168 160 172 160 178 H96 C96 172 94 168 88 160 C76 144 62 130 62 104 C62 66 90 38 128 38 Z" fill="none" stroke="#D08A00" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- filament -->
  <path d="M112 176 L112 132 M144 176 L144 132 M112 132 C112 118 120 116 122 126 C124 136 132 136 134 126 C136 116 144 118 144 132" fill="none" stroke="#C07A00" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
