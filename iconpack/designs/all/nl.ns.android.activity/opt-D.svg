  <rect x="66" y="98" width="124" height="2" fill="#fff" opacity=".5"/>
  <path d="M67 100V202M189 100V202" stroke="#7A5200" stroke-width="2.5" opacity=".75"/>
  <!-- gangway door -->
  <rect x="104" y="106" width="48" height="92" rx="4" fill="none" stroke="#8F6400" stroke-width="3.5"/>
  <rect x="105.8" y="107.8" width="44.4" height="88.4" rx="3" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
  <g fill="#3A3D42"><rect x="110" y="140" width="4.5" height="22" rx="2.2"/><rect x="141.5" y="140" width="4.5" height="22" rx="2.2"/></g>
  <!-- headlights -->
  <g fill="#2A2D32"><rect x="72" y="176" width="24" height="20" rx="9"/><rect x="160" y="176" width="24" height="20" rx="9"/></g>
  <circle cx="84" cy="186" r="7.5" fill="url(#lamp)"/><circle cx="172" cy="186" r="7.5" fill="url(#lamp)"/>
  <!-- coupler -->
  <rect x="108" y="208" width="40" height="14" rx="4" fill="#0B0C0E"/>
  <rect x="116" y="211" width="24" height="8" rx="2" fill="#555A61"/>
  <!-- small NS logo -->
  <use href="#ns" fill="#FFC917" transform="translate(196 212) scale(.26)"/>
  <g clip-path="url(#tc)" fill="none">
    <use href="#t" stroke="#9A6A00" stroke-opacity=".10" stroke-width="5"/>
    <use href="#t" stroke="#9A6A00" stroke-opacity=".14" stroke-width="4" transform="translate(0 -1.5)"/>
    <use href="#t" stroke="#fff" stroke-opacity=".6" stroke-width="2" transform="translate(0 1)"/>
    <use href="#t" stroke="#D99F00" stroke-width="2"/>
  </g>
</svg>
