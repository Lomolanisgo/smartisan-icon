    <clipPath id="markClip"><use href="#mark"/></clipPath>

    <!-- 绿色正面：上亮下深 -->
    <linearGradient id="green" x1="0" y1="30" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AEB48"/>
      <stop offset="0.45" stop-color="#22C61C"/>
      <stop offset="1" stop-color="#009C00"/>
    </linearGradient>
    <!-- 深绿厚度 -->
    <linearGradient id="greenSide" x1="0" y1="30" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C8A0C"/>
      <stop offset="1" stop-color="#035603"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="30" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F5E4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="29" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 滤镜单位为局部坐标（×4.7 后为像素）：5px≈1.06，3px≈0.64，1.5px≈0.32 -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="1.06"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.64"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.32"/></filter>
    <!-- 白线压印投影 -->
    <filter id="emb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.32" stdDeviation="0.22" flood-color="#064A06" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 皇冠实体高约 227，居中略偏上；厚度 7px（1.5 单位），投影偏移 10px -->
  <g transform="translate(-125.8 -131.8) scale(4.7)">
    <!-- 地面投影 -->
    <use href="#sil" transform="translate(0 2.2)" fill="#000" fill-opacity="0.32" filter="url(#shadow)"/>
    <!-- 厚度：向下挤出 -->
    <g fill="url(#greenSide)">
      <use href="#sil" transform="translate(0 1.5)"/>
      <use href="#sil" transform="translate(0 1.1)"/>
      <use href="#sil" transform="translate(0 0.7)"/>
      <use href="#sil" transform="translate(0 0.35)"/>
    </g>
    <!-- 正面与侧面交界暗线 -->
    <use href="#sil" fill="none" stroke="#066B06" stroke-opacity="0.6" stroke-width="0.24"/>
    <!-- 绿色正面 -->
    <use href="#sil" fill="url(#green)"/>
    <g clip-path="url(#silClip)">
      <!-- 内侧柔和暗边 -->
      <use href="#sil" fill="none" stroke="#0B7A0B" stroke-opacity="0.45" stroke-width="2.4" filter="url(#innerBlur)"/>
      <use href="#sil" transform="translate(0 -0.3)" fill="none" stroke="#0A700A" stroke-opacity="0.4" stroke-width="0.8" filter="url(#softBlur)"/>
      <!-- 上沿窄高光 -->
      <use href="#sil" transform="translate(0 0.5)" fill="none" stroke="#C4FFB4" stroke-opacity="0.9" stroke-width="0.7" filter="url(#softBlur)"/>
      <!-- 上半部釉面反光 -->
      <rect x="30" y="29" width="48" height="23" fill="url(#gloss)"/>
    </g>
    <!-- 白色皇冠线条：压印在绿面之上 -->
    <use href="#mark" fill="url(#white)" filter="url(#emb)"/>
    <g clip-path="url(#markClip)">
      <use href="#mark" fill="none" stroke="#A9CFA6" stroke-opacity="0.5" stroke-width="0.5" filter="url(#softBlur)"/>
      <use href="#mark" transform="translate(0 0.2)" fill="none" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.9" filter="url(#softBlur)"/>
    </g>
    <!-- 外轮廓细描边 -->
    <use href="#sil" fill="none" stroke="#075E07" stroke-opacity="0.6" stroke-width="0.22"/>
  </g>
</svg>
