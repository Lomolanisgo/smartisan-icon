    <!-- 皇冠外轮廓实体：由 mark 的外圈白线经形态学闭运算补上三处缺口、填充内部并外扩 0.6 单位后描出（即绿色底板沿皇冠外轮廓抠出）。包围盒 x 31.4–76.6，y 29.8–78.2 -->
    <path id="sil" d="M46.46 29.85L45.29 30.00L44.15 30.29L42.63 31.01L41.29 31.93L40.13 33.09L39.51 33.88L38.43 35.63L37.97 36.63L37.24 38.71L36.92 40.21L36.67 41.79L36.51 43.88L36.51 45.54L36.69 47.13L37.07 49.04L37.04 49.79L36.84 50.29L36.54 50.67L35.21 51.51L33.63 53.00L32.96 53.91L32.19 55.29L31.83 56.38L31.43 58.63L31.43 59.96L31.51 60.46L31.74 61.71L32.13 62.85L32.88 64.26L34.43 66.38L36.34 68.29L38.99 70.21L40.46 71.07L41.88 71.78L44.79 72.92L48.38 73.81L50.79 74.07L53.21 74.07L55.21 73.83L55.79 73.87L56.29 74.08L56.67 74.38L56.97 74.79L57.26 75.46L57.71 75.91L58.91 76.79L60.40 77.63L61.29 77.92L62.63 78.16L64.04 78.16L64.79 78.06L65.85 77.79L66.63 77.41L67.54 76.82L68.25 76.21L69.16 75.21L69.96 74.09L70.74 72.71L71.73 70.38L72.67 67.29L73.34 64.71L75.77 58.38L76.33 56.21L76.57 54.63L76.57 53.46L76.26 51.63L75.79 50.24L74.96 48.82L74.13 47.75L72.88 46.59L71.59 45.71L70.54 45.14L69.79 44.85L68.38 44.42L67.29 44.19L66.46 44.10L65.58 43.63L65.12 42.96L64.98 42.04L64.82 41.63L63.66 39.88L62.57 38.46L60.08 35.88L58.46 34.51L57.21 33.59L55.18 32.29L53.38 31.34L50.63 30.31L49.38 30.02L48.13 29.84Z"/>
