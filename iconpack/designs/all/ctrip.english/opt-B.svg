  <g fill="#4A4E55"><circle cx="75" cy="238" r="4"/><circle cx="181" cy="238" r="4"/></g>
  <g filter="url(#sh)"><rect x="54" y="46" width="148" height="186" rx="24" fill="url(#shell)"/></g>
  <g clip-path="url(#bc)">
