<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="9.062 9.062 237.876 237.876"><g transform="translate(128 128) scale(1.09735) translate(-128 -128)">
  <defs>
    <path id="tile" d="M23 23H233V233H23Z"/>
    <clipPath id="clip"><use href="#tile"/></clipPath>
    <linearGradient id="sky" x1="0" y1="23" x2="0" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC4A6"/><stop offset="0.6" stop-color="#FF9C72"/><stop offset="1" stop-color="#F7875C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="23" x2="0" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E88A62"/><stop offset="1" stop-color="#C96A45"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="40" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E6DF"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="130" x2="0" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BB3A0"/><stop offset="1" stop-color="#11776E"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="150" x2="0" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E9C8E"/><stop offset="1" stop-color="#0C5F58"/>
    </linearGradient>
    <linearGradient id="mtn" x1="120" y1="110" x2="160" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7FB8"/><stop offset="1" stop-color="#15517E"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="56" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C08BFF"/><stop offset="1" stop-color="#8E4FEA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="140" x2="0" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BF0A4"/><stop offset="1" stop-color="#1FBF72"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6A2A10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#sky)"/>
  <g clip-path="url(#clip)">
    <!-- sun glow -->
    <circle cx="140" cy="108" r="100" fill="#FFFFFF" opacity="0.12"/>
    <!-- ferris wheel -->
    <g filter="url(#sh)">
      <circle cx="140" cy="108" r="60" fill="none" stroke="url(#wheel)" stroke-width="15"/>
      <g stroke="url(#wheel)" stroke-width="9" stroke-linecap="round">
        <line x1="140" y1="108" x2="140" y2="50"/>
        <line x1="140" y1="108" x2="90" y2="137"/>
        <line x1="140" y1="108" x2="190" y2="137"/>
      </g>
      <circle cx="140" cy="108" r="13" fill="url(#wheel)"/>
      <circle cx="140" cy="108" r="5" fill="#E9B7A0"/>
    </g>
    <!-- back hills -->
    <path d="M3 170C22 140 40 136 58 150C74 162 84 158 98 146C112 134 126 140 140 160C156 182 176 176 196 196C214 214 234 190 253 186V233H3Z" fill="url(#hill)"/>
    <!-- mountain -->
    <path d="M140 116Q146 110 152 118L204 204H86Z" fill="url(#mtn)" filter="url(#sh)"/>
    <path d="M140 116Q146 110 152 118L164 138L146 132L132 142L128 134Z" fill="#FFFFFF" opacity="0.28"/>
    <!-- front hills -->
    <path d="M3 204C30 186 60 194 84 208C110 222 150 196 180 204C210 212 232 200 253 196V233H3Z" fill="url(#hill2)"/>
    <!-- gondolas -->
    <g filter="url(#sh)">
      <rect x="168" y="56" width="46" height="46" rx="12" fill="url(#purple)"/>
      <rect x="171" y="58" width="40" height="16" rx="8" fill="#FFFFFF" opacity="0.25"/>
      <circle cx="184" cy="79" r="5.5" fill="#FFFFFF"/><circle cx="198" cy="79" r="5.5" fill="#FFFFFF"/>
      <rect x="50" y="142" width="44" height="44" rx="12" fill="url(#green)"/>
      <rect x="53" y="144" width="38" height="15" rx="7.5" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="65" cy="164" r="5.5" fill="#FFFFFF"/><circle cx="79" cy="164" r="5.5" fill="#FFFFFF"/>
    </g>
  </g>
  <g clip-path="url(#clip)" fill="none">
    <use href="#tile" stroke="#000" stroke-opacity="0.06" stroke-width="5"/>
    <use href="#tile" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" transform="translate(0 1)"/>
    <use href="#tile" stroke="url(#rim)" stroke-width="2"/>
  </g>
</g></svg>