<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="paper" x1="0" y1="-84" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAE5DA"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2524A"/>
      <stop offset="1" stop-color="#C41F24"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C8EF0"/>
      <stop offset="1" stop-color="#2A55B8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE17A"/>
      <stop offset="1" stop-color="#E0A020"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9DCCB"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="236" rx="96" ry="10" fill="#000" opacity="0.18"/>
  <!-- back card: pixel Ace of hearts -->
  <g transform="translate(92 126) rotate(-13)" filter="url(#sh)">
    <rect x="-60" y="-84" width="120" height="168" rx="11" fill="url(#paper)" stroke="#C9C1B1" stroke-width="1.5"/>
    <rect x="-54" y="-78" width="108" height="156" rx="7" fill="none" stroke="#E4DCCB" stroke-width="1"/>
    <text x="-46" y="-52" font-family="Segoe UI, Microsoft YaHei" font-weight="700" font-size="26" fill="#D02A2A">A</text>
    <g fill="url(#red)" transform="translate(-28 -18)">
      <path d="M8 0h16v8h8V0h16v8h8v24h-8v8h-8v8h-8v8h-8v-8h-8v-8H8v-8H0V8h8z"/>
    </g>
    <rect x="-12" y="-10" width="8" height="8" fill="#fff" opacity="0.7"/>
  </g>
  <!-- front card: Joker -->
  <g transform="translate(158 128) rotate(9)" filter="url(#sh)">
    <rect x="-60" y="-84" width="120" height="168" rx="11" fill="url(#paper)" stroke="#C9C1B1" stroke-width="1.5"/>
    <rect x="-54" y="-78" width="108" height="156" rx="7" fill="none" stroke="#E4DCCB" stroke-width="1"/>
    <!-- collar -->
    <path d="M-42 38 Q-35 28 -28 38 Q-21 28 -14 38 Q-7 28 0 38 Q7 28 14 38 Q21 28 28 38 Q35 28 42 38 Q42 60 0 62 Q-42 60 -42 38 Z" fill="url(#blue)" stroke="#1E3F8C" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- hat -->
    <path d="M-26 -2 C-40 -20 -50 -30 -52 -50 C-36 -42 -24 -34 -12 -18 Z" fill="url(#red)" stroke="#8E1618" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M26 -2 C40 -20 50 -30 52 -50 C36 -42 24 -34 12 -18 Z" fill="url(#gold)" stroke="#9A6A10" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-20 -8 C-18 -34 -8 -52 0 -66 C8 -52 18 -34 20 -8 Z" fill="url(#blue)" stroke="#1E3F8C" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="-52" cy="-52" r="6" fill="url(#gold)" stroke="#9A6A10" stroke-width="1.2"/>
    <circle cx="52" cy="-52" r="6" fill="url(#red)" stroke="#8E1618" stroke-width="1.2"/>
    <circle cx="0" cy="-68" r="6" fill="url(#gold)" stroke="#9A6A10" stroke-width="1.2"/>
    <!-- face -->
    <ellipse cx="0" cy="12" rx="24" ry="26" fill="url(#skin)" stroke="#B8A690" stroke-width="1.5"/>
    <path d="M-28 -4 C-14 -14 14 -14 28 -4 L24 4 C10 -4 -10 -4 -24 4 Z" fill="url(#red)" stroke="#8E1618" stroke-width="1.2"/>
    <circle cx="-9" cy="8" r="3" fill="#2A2A2A"/>
    <circle cx="9" cy="8" r="3" fill="#2A2A2A"/>
    <circle cx="0" cy="17" r="4" fill="#E0342E"/>
    <path d="M-13 24 Q0 38 13 24 Q0 30 -13 24 Z" fill="#C41F24" stroke="#8E1618" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
