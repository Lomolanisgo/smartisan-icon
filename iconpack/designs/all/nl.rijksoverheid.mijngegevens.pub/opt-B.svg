<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="card" x1="0" y1="50" x2="0" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#D6E6F3"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E97E2"/><stop offset="1" stop-color="#0B6CB3"/>
    </linearGradient>
    <linearGradient id="lint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E528E"/><stop offset="0.5" stop-color="#18467C"/><stop offset="1" stop-color="#11355F"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="96" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5E8F7"/><stop offset="1" stop-color="#B7D5EE"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="20" y="50" width="216" height="156" rx="16"/></clipPath>
    <clipPath id="photoClip"><rect x="38" y="98" width="66" height="84" rx="6"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sh2" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <g id="wapen">
      <circle cx="0" cy="51" r="1.6" fill="#F3CF73"/>
      <path d="M-7 63 L-8.5 55 L-4 58.5 L0 53 L4 58.5 L8.5 55 L7 63Z" fill="#F3CF73"/>
      <path d="M-6.5 66 H6.5 V74 C6.5 79 3.5 82 0 84 C-3.5 82 -6.5 79 -6.5 74Z" fill="#fff"/>
      <path d="M-2.5 70 H2.5 V74 C2.5 76 1.2 77.5 0 78 C-1.2 77.5 -2.5 76 -2.5 74Z" fill="#18467C"/>
      <path d="M-9 67 C-13.5 70 -13.5 79 -10 83 L-8 81.5 C-10 77 -9.8 72 -8 68.5Z" fill="#fff"/>
      <path d="M9 67 C13.5 70 13.5 79 10 83 L8 81.5 C10 77 9.8 72 8 68.5Z" fill="#fff"/>
      <rect x="-12" y="86" width="24" height="2.6" rx="1.3" fill="#fff"/>
    </g>
  </defs>
  <g filter="url(#sh)">
    <rect x="20" y="50" width="216" height="156" rx="16" fill="url(#card)"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="20" y="50" width="216" height="36" fill="url(#band)"/>
    <rect x="20" y="85" width="216" height="1.5" fill="#fff" opacity="0.6"/>
    <rect x="38" y="64" width="80" height="8" rx="4" fill="#fff" opacity="0.85"/>
    <!-- photo -->
    <rect x="38" y="98" width="66" height="84" rx="6" fill="url(#photo)"/>
    <g clip-path="url(#photoClip)">
      <circle cx="71" cy="128" r="15" fill="#1C7DC8"/>
      <path d="M43 186 C43 160 56 148 71 148 C86 148 99 160 99 186Z" fill="#1C7DC8"/>
    </g>
    <!-- data lines -->
    <rect x="118" y="104" width="52" height="8" rx="4" fill="#1C7DC8"/>
    <rect x="118" y="122" width="72" height="7" rx="3.5" fill="#9CC6E8"/>
    <rect x="118" y="138" width="60" height="7" rx="3.5" fill="#9CC6E8"/>
    <rect x="118" y="154" width="66" height="7" rx="3.5" fill="#9CC6E8"/>
    <rect x="38" y="190" width="180" height="4" rx="2" fill="#B9CFE0"/>
    <rect x="20" y="51" width="216" height="1.5" fill="#fff" opacity="0.5"/>
  </g>
  <!-- Rijkslint tag hanging over the card edge -->
  <g filter="url(#sh2)">
    <path d="M196 40 H232 V124 L214 116 L196 124Z" fill="url(#lint)"/>
  </g>
  <use href="#wapen" transform="translate(214 0)"/>
  <rect x="196" y="40" width="36" height="2" fill="#fff" opacity="0.25"/>
</svg>
