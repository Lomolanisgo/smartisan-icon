<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <path id="tile" d="M15 15H241V241H15Z"/><clipPath id="clip"><use href="#tile"/></clipPath>
    <linearGradient id="fill" x1="0" y1="15" x2="0" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FB2F0"/><stop offset=".55" stop-color="#0A7AD6"/><stop offset="1" stop-color="#0357A8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="44" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9ECF0"/>
    </linearGradient>
    <linearGradient id="fold" x1="196" y1="64" x2="210" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#C9CED6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="88" x2="0" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28A0E8"/><stop offset="1" stop-color="#0357A8"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="118" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CC0F5"/><stop offset="1" stop-color="#1C8EE0"/>
    </linearGradient>
    <linearGradient id="env2" x1="0" y1="156" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AD3FA"/><stop offset="1" stop-color="#3AA6EC"/>
    </linearGradient>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#03478C" flood-opacity=".55"/>
    </filter>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#fill)"/>
  <g clip-path="url(#clip)" fill="none">
    <ellipse cx="128" cy="10" rx="190" ry="80" fill="#fff" opacity=".13"/>
    <use href="#tile" stroke="#000" stroke-opacity=".14" stroke-width="5"/>
    <use href="#tile" stroke="#fff" stroke-opacity=".35" stroke-width="2" transform="translate(0 1)"/>
    <use href="#tile" stroke="#03478C" stroke-width="2"/>
  </g>
  <!-- paper sheet with dog-ear -->
  <path d="M92 44H200L220 64V214H92Z" fill="url(#paper)" filter="url(#sheetShadow)"/>
  <path d="M92.5 44.5H200L219.5 64V213.5H92.5Z" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="116" y="60" width="56" height="7" fill="#0078D4"/><rect x="116" y="76" width="80" height="5" fill="#C5CBD3"/><rect x="116" y="88" width="80" height="5" fill="#C5CBD3"/><rect x="116" y="100" width="60" height="5" fill="#C5CBD3"/>
  <path d="M92 118L154 158L220 118V214H92Z" fill="url(#env)"/>
    <path d="M92 214L144 162Q154 154 164 162L220 214Z" fill="url(#env2)"/>
    <path d="M92 118L154 158L220 118" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
  <path d="M200 44V64H220Z" fill="url(#fold)"/>
  <path d="M200 64H220" stroke="#AEB5BF" stroke-width="1"/>
  <!-- brand letter plate -->
  <g filter="url(#plateShadow)"><rect x="34" y="88" width="100" height="100" rx="4" fill="url(#plate)"/></g>
  <rect x="35" y="89" width="98" height="98" rx="3.5" fill="none" stroke="#03478C" stroke-width="2"/>
  <path d="M37 91H131" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M36 90H132V132Q84 122 36 140Z" fill="#fff" opacity=".1"/>
  <text x="84" y="163" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="71.4" fill="#FFFFFF" filter="url(#glyphShadow)">O</text>
</svg>
