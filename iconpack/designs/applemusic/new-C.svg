  <g filter="url(#sh)"><circle cx="128" cy="126" r="120" fill="url(#rim)"/></g>
  <circle cx="128" cy="126" r="119.3" fill="none" stroke="#b8b9c0" stroke-width="1.4"/>
  <circle cx="128" cy="128" r="107" fill="url(#groove)"/>
  <circle cx="128" cy="128" r="104" fill="url(#base)"/>
