  <!-- 徽章高约 232（含包边），居中略偏上 -->
  <g transform="translate(128 120) scale(1.82)" stroke-linejoin="round">
    <!-- 地面投影 -->
    <use href="#e" transform="translate(0 6.5)" stroke="#000" stroke-width="6" stroke-opacity="0.32" fill="#000" fill-opacity="0.32" filter="url(#shadow)"/>
    <!-- 钢质包边的厚度 -->
    <use href="#e" transform="translate(0 4)" stroke="url(#steelSide)" stroke-width="5" fill="url(#steelSide)"/>
    <use href="#e" transform="translate(0 2)" stroke="#6C727A" stroke-width="5" fill="#6C727A"/>
    <!-- 包边外缘细暗线 -->
    <use href="#e" stroke="#464B52" stroke-width="6" stroke-opacity="0.6" fill="none"/>
    <!-- 包边正面 -->
    <use href="#e" stroke="url(#steel)" stroke-width="5" fill="url(#steel)"/>
    <!-- 包边外侧上沿的镀铬高光线（只落在路徽外侧、朝上的边） -->
    <g clip-path="url(#outside)">
      <use href="#e" transform="translate(0 -1.5)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
    </g>
    <!-- 红色珐琅：薄厚度 + 正面 -->
    <use href="#e" transform="translate(0 1.4)" fill="#8E100C"/>
    <use href="#e" fill="url(#red)"/>
    <g clip-path="url(#eClip)">
      <use href="#e" fill="none" stroke="#7E0A07" stroke-width="5" stroke-opacity="0.45" filter="url(#innerBlur)"/>
      <use href="#e" transform="translate(0 1.1)" fill="none" stroke="#FFC9BF" stroke-width="1.4" stroke-opacity="0.85" filter="url(#softBlur)"/>
      <rect x="-60" y="-62" width="120" height="52" fill="url(#gloss)"/>
    </g>
    <!-- 红与钢交界细线 -->
    <use href="#e" fill="none" stroke="#5E0806" stroke-width="0.5" stroke-opacity="0.7"/>
  </g>
