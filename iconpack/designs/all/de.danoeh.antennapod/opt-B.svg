<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="steel" x1="80" y1="0" x2="176" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E8691"/>
      <stop offset="0.35" stop-color="#F3F5F8"/>
      <stop offset="0.6" stop-color="#B9C0C9"/>
      <stop offset="1" stop-color="#6D7580"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#DDF3FF"/>
      <stop offset="0.35" stop-color="#48B6F8"/>
      <stop offset="1" stop-color="#0E4FC4"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="20" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FD0FF"/>
      <stop offset="1" stop-color="#1E7BEA"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="214" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6470"/>
      <stop offset="1" stop-color="#2E353D"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="128" cy="240" rx="70" ry="6" fill="#000" opacity="0.3" filter="url(#blur)"/>
  <!-- signal waves (glass) -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" filter="url(#glow)">
    <g stroke-width="10" opacity="0.95">
      <path d="M90 42 A54 54 0 0 0 90 118"/>
      <path d="M166 42 A54 54 0 0 1 166 118"/>
    </g>
    <g stroke-width="10" opacity="0.6">
      <path d="M62 20 A88 88 0 0 0 62 140"/>
      <path d="M194 20 A88 88 0 0 1 194 140"/>
    </g>
  </g>
  <!-- tower -->
  <g stroke="url(#steel)" stroke-linecap="round" fill="none">
    <path d="M128 92 L86 226" stroke-width="12"/>
    <path d="M128 92 L170 226" stroke-width="12"/>
    <path d="M110 150 H146" stroke-width="7"/>
    <path d="M99 186 H157" stroke-width="7"/>
    <path d="M110 150 L157 186 M146 150 L99 186" stroke-width="4" opacity="0.85"/>
    <path d="M99 186 L150 220 M157 186 L106 220" stroke-width="4" opacity="0.85"/>
  </g>
  <rect x="68" y="218" width="120" height="18" rx="6" fill="url(#base)"/>
  <rect x="68" y="218" width="120" height="3" rx="1.5" fill="#FFFFFF" opacity="0.3"/>
  <!-- orb -->
  <circle cx="128" cy="80" r="24" fill="url(#orb)"/>
  <circle cx="128" cy="80" r="24" fill="none" stroke="#0A3E9E" stroke-opacity="0.4" stroke-width="1.5"/>
  <ellipse cx="120" cy="70" rx="9" ry="5.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 120 70)"/>
</svg>
