<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- GG 环：两个互扣圆环（圆心 (96,128)/(160,128)，外径 52、内径 24），比例来自 opt-A 中按官方图标复刻的路径 -->
    <path id="ringL" fill-rule="evenodd" d="M44 128a52 52 0 1 0 104 0a52 52 0 1 0 -104 0zM72 128a24 24 0 1 0 48 0a24 24 0 1 0 -48 0z"/>
    <path id="ringR" fill-rule="evenodd" d="M108 128a52 52 0 1 0 104 0a52 52 0 1 0 -104 0zM136 128a24 24 0 1 0 48 0a24 24 0 1 0 -48 0z"/>
    <clipPath id="clipL"><use href="#ringL"/></clipPath>
    <clipPath id="clipR"><use href="#ringR"/></clipPath>
    <!-- 下半区：青环压在暖环上面 -->
    <clipPath id="lower"><rect x="0" y="128" width="256" height="128"/></clipPath>
    <clipPath id="upper"><rect x="0" y="0" width="256" height="128"/></clipPath>
    <linearGradient id="seam" x1="0" y1="128" x2="0" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.35"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="teal" x1="0" y1="76" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6F4F4"/><stop offset="0.45" stop-color="#5BD6E0"/><stop offset="1" stop-color="#1FA3B9"/>
    </linearGradient>
    <linearGradient id="tealSide" x1="0" y1="76" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A8FA0"/><stop offset="1" stop-color="#0E6674"/>
    </linearGradient>
    <linearGradient id="warm" x1="108" y1="0" x2="212" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66C"/><stop offset="0.32" stop-color="#F2787B"/><stop offset="0.66" stop-color="#A96CEB"/><stop offset="1" stop-color="#7A6AF4"/>
    </linearGradient>
    <linearGradient id="warmSide" x1="108" y1="0" x2="212" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C88F22"/><stop offset="0.32" stop-color="#B3444B"/><stop offset="0.66" stop-color="#6A3DBA"/><stop offset="1" stop-color="#4A43BE"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="76" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="3.6"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>

    <!-- 青环整体（厚度 + 正面 + 内侧暗边 + 高光） -->
    <g id="tealStack">
      <use href="#ringL" transform="translate(0 6)" fill="url(#tealSide)"/>
      <use href="#ringL" transform="translate(0 3)" fill="#1B95A8"/>
      <use href="#ringL" fill="url(#teal)"/>
      <g clip-path="url(#clipL)">
        <use href="#ringL" fill="none" stroke="#12798A" stroke-width="10" stroke-opacity="0.42" filter="url(#innerBlur)"/>
        <use href="#ringL" transform="translate(0 2)" fill="none" stroke="#E6FFFF" stroke-width="3" stroke-opacity="0.85" filter="url(#softBlur)"/>
        <ellipse cx="96" cy="86" rx="40" ry="14" fill="url(#gloss)"/>
      </g>
      <path d="M62 116A30 30 0 0 1 90 94" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
      <use href="#ringL" fill="none" stroke="#0F6E7C" stroke-width="0.9" stroke-opacity="0.55"/>
    </g>
    <!-- 暖环整体 -->
    <g id="warmStack">
      <use href="#ringR" transform="translate(0 6)" fill="url(#warmSide)"/>
      <use href="#ringR" transform="translate(0 3)" fill="url(#warmSide)"/>
      <use href="#ringR" fill="url(#warm)"/>
      <use href="#ringR" fill="url(#shade)"/>
      <g clip-path="url(#clipR)">
        <use href="#ringR" fill="none" stroke="#5B2E9E" stroke-width="10" stroke-opacity="0.38" filter="url(#innerBlur)"/>
        <use href="#ringR" transform="translate(0 2)" fill="none" stroke="#FFF3E6" stroke-width="3" stroke-opacity="0.8" filter="url(#softBlur)"/>
        <ellipse cx="160" cy="86" rx="40" ry="14" fill="url(#gloss)"/>
      </g>
      <path d="M190 100A30 30 0 0 1 204 122" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
      <use href="#ringR" fill="none" stroke="#5A3AA8" stroke-width="0.9" stroke-opacity="0.5"/>
    </g>
  </defs>

  <!-- 标志宽约 235，居中略偏上 -->
  <g transform="translate(128 122) scale(1.4) translate(-128 -128)">
    <!-- 地面投影 -->
    <g transform="translate(0 9)" fill="#000" fill-opacity="0.3" filter="url(#shadow)">
      <use href="#ringL"/><use href="#ringR"/>
    </g>
    <use href="#tealStack"/>
    <!-- 上半区：暖环压在青环上，投下接触阴影 -->
    <g clip-path="url(#upper)"><g clip-path="url(#clipL)">
      <use href="#ringR" transform="translate(0 5)" fill="#000" fill-opacity="0.32" filter="url(#innerBlur)"/>
    </g></g>
    <use href="#warmStack"/>
    <!-- 下半区：青环压在暖环上，投下接触阴影 -->
    <g clip-path="url(#lower)"><g clip-path="url(#clipR)">
      <use href="#ringL" transform="translate(0 5)" fill="#000" fill-opacity="0.32" filter="url(#innerBlur)"/>
    </g></g>
    <!-- 下半区青环压回暖环之上，形成互扣 -->
    <g clip-path="url(#lower)"><use href="#tealStack"/></g>
    <!-- 交接线下方的柔和阴影，让暖环边缘像真的压在青环上 -->
    <g clip-path="url(#clipL)"><g clip-path="url(#clipR)">
      <rect x="100" y="128" width="56" height="8" fill="url(#seam)"/>
    </g></g>
  </g>
</svg>
