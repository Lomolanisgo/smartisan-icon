<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E757C"/><stop offset="0.15" stop-color="#D8DDE1"/><stop offset="0.85" stop-color="#C3C9CE"/><stop offset="1" stop-color="#5E656C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="20" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B3A45"/><stop offset="1" stop-color="#0E151B"/>
    </linearGradient>
    <linearGradient id="wall" x1="60" y1="30" x2="190" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58DDE2"/><stop offset="1" stop-color="#0F8C95"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="80" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9F6F8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="ish" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#04464B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="52" y="10" width="152" height="236" rx="30" fill="url(#frame)"/>
  </g>
  <rect x="56" y="14" width="144" height="228" rx="26" fill="url(#glass)"/>
  <rect x="63" y="21" width="130" height="214" rx="19" fill="url(#wall)"/>
  <!-- app dots on screen -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="78" y="46" width="26" height="26" rx="7"/><rect x="115" y="46" width="26" height="26" rx="7"/>
    <rect x="78" y="86" width="26" height="26" rx="7" opacity="0.7"/><rect x="115" y="86" width="26" height="26" rx="7" opacity="0.7"/>
  </g>
  <!-- side gesture handle glow -->
  <rect x="180" y="80" width="10" height="96" rx="5" fill="#FFFFFF" filter="url(#glow)" opacity="0.9"/>
  <rect x="181" y="80" width="8" height="96" rx="4" fill="url(#bar)"/>
  <!-- swipe arrow -->
  <g filter="url(#ish)" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 164C140 164 112 170 96 196"/>
    <path d="M92 174L94 200L119 204"/>
  </g>
  <path d="M63 40C63 29 71 21 82 21H193V70L63 170Z" fill="url(#refl)"/>
  <rect x="108" y="26" width="40" height="6" rx="3" fill="#0E151B" opacity="0.6"/>
</svg>
