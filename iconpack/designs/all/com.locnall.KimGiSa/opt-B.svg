<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6FFF9"/><stop offset="0.5" stop-color="#8ADCCB"/><stop offset="1" stop-color="#3E9C88"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2E3A3C"/><stop offset="1" stop-color="#0B0F10"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FFFC"/><stop offset="1" stop-color="#B8D8D0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#B0FFE4"/><stop offset="0.6" stop-color="#22C08A"/><stop offset="1" stop-color="#0E7A56"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3CF0B0" stop-opacity="0.7"/><stop offset="1" stop-color="#3CF0B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1AA888"/><stop offset="0.5" stop-color="#9FF7E6"/><stop offset="1" stop-color="#1AA888"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.6"/></filter>
  </defs>
  <circle cx="128" cy="130" r="116" fill="#000" opacity="0.15"/>
  <circle cx="128" cy="128" r="116" fill="url(#bezel)"/>
  <circle cx="128" cy="128" r="104" fill="url(#face)"/>
  <!-- arch bridge with cables -->
  <g stroke-linecap="round">
    <path d="M44 118 Q128 40 212 118" fill="none" stroke="url(#arch)" stroke-width="9"/>
    <g stroke="#3FD0AE" stroke-width="3" opacity="0.85">
      <line x1="72" y1="92" x2="72" y2="120"/>
      <line x1="94" y1="78" x2="94" y2="120"/>
      <line x1="116" y1="71" x2="116" y2="120"/>
      <line x1="140" y1="71" x2="140" y2="120"/>
      <line x1="162" y1="78" x2="162" y2="120"/>
      <line x1="184" y1="92" x2="184" y2="120"/>
    </g>
    <line x1="40" y1="122" x2="216" y2="122" stroke="#8ADCCB" stroke-width="6"/>
  </g>
  <!-- live pill -->
  <g filter="url(#sh)">
    <rect x="52" y="146" width="152" height="46" rx="23" fill="url(#pill)"/>
  </g>
  <rect x="58" y="149" width="140" height="18" rx="9" fill="#fff" opacity="0.7"/>
  <circle cx="176" cy="169" r="26" fill="url(#dotglow)"/>
  <circle cx="176" cy="169" r="17" fill="url(#dot)"/>
  <circle cx="171" cy="163" r="5" fill="#fff" opacity="0.7"/>
  <g fill="none" stroke="#2E8A74" stroke-width="4" stroke-linecap="round">
    <path d="M82 158 Q74 169 82 180"/>
    <path d="M96 162 Q91 169 96 176"/>
    <path d="M140 158 Q148 169 140 180"/>
    <path d="M126 162 Q131 169 126 176"/>
