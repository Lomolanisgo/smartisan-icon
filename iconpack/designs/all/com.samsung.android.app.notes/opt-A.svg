<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <path id="page" d="M47 3.06H208.93C227.73 3.06 232.93 8.26 232.93 27.06V200L180 252.94H47C28.2 252.94 23 247.74 23 228.94V27.06C23 8.26 28.2 3.06 47 3.06Z"/>
    <clipPath id="pc"><use href="#page"/></clipPath>
    <linearGradient id="paper" x1="0" y1="3" x2="0" y2="253" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F0EB"/>
    </linearGradient>
    <linearGradient id="cover" x1="23" y1="0" x2="72" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A4A"/><stop offset="1" stop-color="#DA2E22"/>
    </linearGradient>
    <linearGradient id="fold" x1="232" y1="200" x2="186" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9D2C8"/><stop offset="0.5" stop-color="#F4F0EA"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/><stop offset="0.5" stop-color="#A9AFB5"/><stop offset="1" stop-color="#6E757C"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="-11" x2="0" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A5C"/><stop offset="0.35" stop-color="#F0502E"/><stop offset="1" stop-color="#A81E14"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="-11" x2="0" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#7E858C"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/></filter>
    <filter id="dsh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.22"/></filter>
  </defs>
  <use href="#page" fill="url(#paper)" filter="url(#dsh)"/>
  <g clip-path="url(#pc)">
    <!-- cover strip along the left edge: pages turn sideways like a book -->
    <rect x="0" y="0" width="70" height="256" fill="url(#cover)"/>
    <rect x="69" y="0" width="2" height="256" fill="#000" fill-opacity="0.15"/>
    <rect x="71" y="0" width="4" height="256" fill="#000" fill-opacity="0.04"/>
    <rect x="0" y="4" width="256" height="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
    <g stroke="#E6D9D2" stroke-width="2">
      <line x1="88" y1="44" x2="212" y2="44"/><line x1="88" y1="70" x2="212" y2="70"/>
      <line x1="88" y1="96" x2="212" y2="96"/><line x1="88" y1="122" x2="212" y2="122"/>
      <line x1="88" y1="148" x2="212" y2="148"/><line x1="88" y1="174" x2="212" y2="174"/>
      <line x1="88" y1="200" x2="212" y2="200"/><line x1="88" y1="226" x2="170" y2="226"/>
    </g>
  </g>
  <use href="#page" fill="none" stroke="#000" stroke-opacity="0.13"/>
  <!-- spiral along the left edge -->
  <g fill="#8E1A12">
    <circle cx="46" cy="38" r="5"/><circle cx="46" cy="74" r="5"/><circle cx="46" cy="110" r="5"/>
    <circle cx="46" cy="146" r="5"/><circle cx="46" cy="182" r="5"/><circle cx="46" cy="218" r="5"/>
  </g>
  <g fill="url(#coil)" stroke="#5A6168" stroke-width="0.8">
    <rect x="4" y="34" width="44" height="8" rx="4"/><rect x="4" y="70" width="44" height="8" rx="4"/>
    <rect x="4" y="106" width="44" height="8" rx="4"/><rect x="4" y="142" width="44" height="8" rx="4"/>
    <rect x="4" y="178" width="44" height="8" rx="4"/><rect x="4" y="214" width="44" height="8" rx="4"/>
  </g>
  <!-- folded corner -->
  <path d="M232.93 200L180 252.94L184 212C185 205 188 203 194 202Z" fill="#000" fill-opacity="0.12" transform="translate(-3 -3)"/>
  <path d="M232.93 200L180 252.94L184 212C185 205 188 203 194 202Z" fill="url(#fold)" stroke="#CFC6BA" stroke-width="1"/>
  <!-- handwriting -->
  <path transform="translate(42 -44)" d="M52 108c8-10 14-10 16 0s8 8 14-2 12-8 14 2 10 6 16-4" fill="none" stroke="#3E3E3E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- S Pen -->
  <g transform="translate(118 196) rotate(-50)" filter="url(#sh)">
    <path d="M0 -11H118C124 -11 128 -6 128 0S124 11 118 11H0Z" fill="url(#pen)"/>
    <path d="M0 -11L-30 -2C-33 -1 -33 1 -30 2L0 11Z" fill="url(#tip)"/>
    <rect x="-3" y="-11" width="6" height="22" fill="#2E2E2E" fill-opacity="0.55"/>
    <rect x="40" y="-7" width="16" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="6" y="-8" width="112" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
</svg>
