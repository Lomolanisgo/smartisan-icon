    </linearGradient>
    <radialGradient id="lens" cx="90" cy="60" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FC6FF"/><stop offset="0.6" stop-color="#1E88F5"/><stop offset="1" stop-color="#0A4FB8"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B1F26"/><stop offset="0.45" stop-color="#4A5260"/><stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="40" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6EAFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="24" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="osh" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity="0.32"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002a66" flood-opacity="0.5"/></filter>
