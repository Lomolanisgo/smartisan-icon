<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <path id="tile" d="M15 15H241V241H15Z"/><clipPath id="clip"><use href="#tile"/></clipPath>
    <linearGradient id="fill" x1="0" y1="15" x2="0" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDEEF0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="15" x2="0" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2C4C8"/><stop offset=".2" stop-color="#CDCFD3"/><stop offset=".85" stop-color="#D6D8DB"/><stop offset="1" stop-color="#C8CACE"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="44" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A8BE0"/><stop offset=".6" stop-color="#1D63C4"/><stop offset="1" stop-color="#123F91"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="54" x2="0" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D63C4"/><stop offset="1" stop-color="#3A8BE0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="190" x2="0" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123F91"/><stop offset="1" stop-color="#0C3478"/>
    </linearGradient>
    <linearGradient id="sideH" x1="46" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".12" stop-color="#000" stop-opacity="0"/><stop offset=".88" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="contact" cx="128" cy="212" r="92" gradientTransform="translate(0 169.6) scale(1 .2)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#fill)"/>
  <g clip-path="url(#clip)" fill="none">
    <use href="#tile" stroke="#000" stroke-opacity=".06" stroke-width="5"/>
    <use href="#tile" stroke="#fff" stroke-width="2" transform="translate(0 1)"/>
    <use href="#tile" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <!-- contact shadow -->
  <ellipse cx="128" cy="212" rx="92" ry="18.4" fill="url(#contact)"/>
  <!-- block body (depth) -->
  <rect x="46" y="52" width="164" height="160" rx="6" fill="url(#side)"/>
  <rect x="46" y="52" width="164" height="160" rx="6" fill="url(#sideH)"/>
  <path d="M50 210.5H206" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
  <!-- top face -->
  <rect x="46" y="40" width="164" height="156" rx="6" fill="url(#face)"/>
  <rect x="46.75" y="40.75" width="162.5" height="154.5" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- concave inset -->
  <rect x="58" y="52" width="140" height="132" rx="4" fill="url(#inner)"/>
  <path d="M58.5 184V56Q58.5 52.5 62 52.5H194Q197.5 52.5 197.5 56" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M58.5 183.5H197.5V56" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M58 52H198V110Q128 96 58 124Z" fill="#fff" opacity=".1"/>
  <text x="128" y="159" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="117.1" fill="#FFFFFF" filter="url(#glyphShadow)">W</text>
</svg>
