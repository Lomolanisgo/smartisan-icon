<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 官方金拱门 M 路径（来自手机图标 SVG），原始包围盒约 x 1.3–272，y 1.1–237.6 -->
    <path id="m" d="M195.8,17.93c23.3,0 42.2,98.3 42.2,219.7h34c0,-130.7 -34.3,-236.5 -76.3,-236.5 -24,0 -45.2,31.7 -59.2,81.5 -14,-49.8 -35.2,-81.5 -59,-81.5 -42,0 -76.2,105.7 -76.2,236.4h34c0,-121.4 18.7,-219.6 42,-219.6s42.2,90.8 42.2,202.8h33.8c0,-112 19,-202.8 42.3,-202.8z"/>
    <clipPath id="mClip"><use href="#m"/></clipPath>

    <!-- 正面：上亮下深的金色 -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEE85"/>
      <stop offset="0.35" stop-color="#FFD437"/>
      <stop offset="0.75" stop-color="#FBB515"/>
      <stop offset="1" stop-color="#F09E05"/>
    </linearGradient>
    <!-- 侧面（厚度） -->
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D67F00"/>
      <stop offset="1" stop-color="#B36400"/>
    </linearGradient>
    <!-- 拱顶横向高光 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 整体缩放：M 宽约 234，居中，略靠上给投影留位置 -->
  <g transform="translate(22.3 31.3) scale(0.7785)">
    <!-- 地面投影 -->
    <use href="#m" transform="translate(0 12)" fill="#000" fill-opacity="0.32" filter="url(#shadow)"/>
    <!-- 厚度：向下挤出 6 单位 -->
    <use href="#m" transform="translate(0 9)" fill="url(#side)"/>
    <use href="#m" transform="translate(0 5)" fill="#CC7600"/>
    <!-- 正面 -->
    <use href="#m" fill="url(#face)"/>
    <!-- 正面内侧的暗边（让弧线有圆润的立体感） -->
    <g clip-path="url(#mClip)">
      <use href="#m" fill="none" stroke="#C46A00" stroke-width="16" stroke-opacity="0.42" filter="url(#innerBlur)"/>
      <use href="#m" fill="none" stroke="#E08A00" stroke-width="6" stroke-opacity="0.35" filter="url(#softBlur)"/>
      <!-- 顶部窄高光沿着上边缘 -->
      <use href="#m" transform="translate(0 3)" fill="none" stroke="#FFF6C2" stroke-width="5" stroke-opacity="0.9" filter="url(#softBlur)"/>
      <!-- 两个拱顶的柔和光斑 -->
      <ellipse cx="78" cy="34" rx="34" ry="16" fill="url(#gloss)"/>
      <ellipse cx="196" cy="34" rx="34" ry="16" fill="url(#gloss)"/>
      <!-- 竖笔上的柔和纵向高光 -->
      <rect x="44" y="40" width="9" height="190" rx="4" fill="#FFFFFF" fill-opacity="0.22" filter="url(#softBlur)"/>
      <rect x="203" y="40" width="9" height="190" rx="4" fill="#FFFFFF" fill-opacity="0.22" filter="url(#softBlur)"/>
      <rect x="128" y="95" width="8" height="120" rx="4" fill="#FFFFFF" fill-opacity="0.16" filter="url(#softBlur)"/>
    </g>
    <!-- 外轮廓细描边 -->
    <use href="#m" fill="none" stroke="#B05C00" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>
</svg>
