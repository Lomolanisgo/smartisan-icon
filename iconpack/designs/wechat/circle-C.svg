<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 微信 · 圆形气泡 C：绿色圆底（直径 248）+ 微信官方的一大一小两个白色气泡 -->
  <defs>
    <radialGradient id="fill" cx="96" cy="44" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8EEA5E"/><stop offset="0.5" stop-color="#41CB2E"/><stop offset="1" stop-color="#1C9E18"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9F7AE" stop-opacity="0.9"/><stop offset="0.5" stop-color="#2F9A22" stop-opacity="0.5"/><stop offset="1" stop-color="#16750F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4F2DE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feFlood flood-color="#0B5A08"/><feComposite operator="in" in2="SourceGraphic"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="128" cy="128" r="124"/></clipPath>
    <!-- big bubble (left, tail bottom-left) and small bubble (right, tail bottom-right) -->
    <path id="big" d="M108 52C146 52 176 77 176 109C176 141 146 166 108 166C99 166 90.5 164.6 82.7 162L62 173L67.5 153.3C51.6 142.9 40 127 40 109C40 77 70 52 108 52Z"/>
    <path id="small" d="M164 118C196 118 222 139.5 222 166C222 180 214.6 192.5 203 201.2L207 217L190 208.3C182 212 173.3 214 164 214C132 214 106 192.5 106 166C106 139.5 132 118 164 118Z"/>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#fill)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="30" rx="150" ry="98" fill="url(#gloss)"/>
    <circle cx="128" cy="128" r="124" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="5"/>
    <circle cx="128" cy="128" r="123" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>
  <g filter="url(#soft)">
    <use href="#big" fill="url(#white)"/>
  </g>
  <g fill="#2E9B24"><circle cx="86" cy="96" r="9"/><circle cx="130" cy="96" r="9"/></g>
  <g filter="url(#soft)">
    <use href="#small" fill="url(#white)" stroke="#2FA526" stroke-width="4"/>
  </g>
  <g fill="#2E9B24"><circle cx="146" cy="156" r="7.5"/><circle cx="182" cy="156" r="7.5"/></g>
</svg>
