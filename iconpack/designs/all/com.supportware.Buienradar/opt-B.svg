<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cloud" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E9EEF5"/><stop offset="1" stop-color="#C4CEDC"/>
    </linearGradient>
    <linearGradient id="cloudBack" x1="0" y1="30" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3452B0"/><stop offset="1" stop-color="#132A74"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8DDFF"/><stop offset="1" stop-color="#2F8BD6"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B1D57" flood-opacity="0.3"/>
    </filter>
    <filter id="ds2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0B1D57" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- dark navy back cloud -->
  <path d="M112 118C104 118 98 112 98 104C98 94 106 88 114 88C116 66 134 50 156 50C176 50 192 64 196 82C212 82 226 94 226 110C226 116 224 118 220 118Z" fill="url(#cloudBack)" filter="url(#ds)"/>
  <path d="M120 88C124 70 138 58 156 58" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <!-- front white cloud -->
  <path d="M60 166C40 166 26 152 26 134C26 116 40 102 58 102C62 76 84 58 110 58C134 58 152 72 160 92C166 90 170 90 176 90C198 90 214 106 214 128C214 150 198 166 176 166Z" fill="url(#cloud)" filter="url(#ds)"/>
  <path d="M40 124C44 112 54 106 64 106M72 96C78 78 94 66 112 66" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- rain streaks in brand comet form -->
  <g filter="url(#ds2)" fill="url(#drop)">
    <path d="M62 236C64 222 72 204 88 186C90 184 94 186 93 189C86 206 76 222 62 236Z"/>
    <path d="M108 244C110 226 120 204 138 184C140 182 144 184 143 187C134 208 122 228 108 244Z"/>
    <path d="M156 228C158 214 166 198 180 182C182 180 186 182 185 185C178 200 170 214 156 228Z"/>
  </g>
</svg>
