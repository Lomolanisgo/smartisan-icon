<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <path id="s" d="SPARK"/>
    <linearGradient id="paper" x1="0" y1="18" x2="0" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#EDE4D3"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="50" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D2704D"/>
      <stop offset="1" stop-color="#C4603E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4" result="b"/>
      <feFlood flood-color="#4a3420" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.26  0 0 0 0 0.16  0 0 0 0.9 -0.35" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- inset (debossed) shading -->
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="2.6"/>
      <feGaussianBlur stdDeviation="1.6" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="1" k3="-1" result="rim"/>
      <feFlood flood-color="#5a2410" flood-opacity="0.75"/>
      <feComposite in2="rim" operator="in" result="dark"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <clipPath id="tile"><rect x="22" y="20" width="212" height="212" rx="30"/></clipPath>
  </defs>
  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="22" y="20" width="212" height="212" rx="30" fill="url(#paper)"/>
  </g>
  <rect x="22" y="20" width="212" height="212" rx="30" fill="#fff" filter="url(#grain)" opacity="0.22"/>
  <rect x="22.5" y="20.5" width="211" height="211" rx="29.5" fill="none" stroke="#fff" stroke-opacity="0.9"/>
  <rect x="22" y="20" width="212" height="212" rx="30" fill="none" stroke="#CFC3AE" stroke-width="1" stroke-opacity="0.8"/>
  <!-- deboss: light catch on lower lip -->
  <use xlink:href="#s" fill="#fff" opacity="0.95" filter="url(#soft)" transform="translate(128 127.8) scale(1.78) translate(-52.9 -54.2)"/>
  <!-- pressed ink -->
  <g filter="url(#inset)">
    <use xlink:href="#s" fill="url(#ink)" transform="translate(128 126) scale(1.78) translate(-52.9 -54.2)"/>
  </g>
</svg>
