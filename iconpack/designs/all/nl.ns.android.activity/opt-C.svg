<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- NS ICM Koploper cab car, side profile. Shape reference: Märklin 39425 (https://www.marklin.nl/producten/details/article/39425) -->
  <defs>
    <linearGradient id="yel" x1="0" y1="92" x2="0" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#F0B000"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="60" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A6F76"/><stop offset="1" stop-color="#34373C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="108" x2="0" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A5CC4"/><stop offset="1" stop-color="#153E96"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEF3"/><stop offset="1" stop-color="#9AA6B2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5563"/><stop offset="1" stop-color="#11161D"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5D9DE"/><stop offset=".4" stop-color="#8E959D"/><stop offset="1" stop-color="#4E545B"/>
    </linearGradient>
    <radialGradient id="wheel" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#5A5F66"/><stop offset="1" stop-color="#111214"/>
    </radialGradient>
    <filter id="sh" x="-5%" y="-10%" width="110%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="ns" d="M100.983,69.133C95.517,69.133 90.733,67.085 87.317,63.672L67.5,43.192C66.133,42.509 64.767,41.827 63.4,41.827H26.5L53.833,69.133H34.7L0.533,35L34.7,0.867H75.017C80.483,0.867 85.267,2.915 88.683,6.328L108.5,26.808C109.867,27.491 111.233,28.173 112.6,28.173H149.5L122.167,0.867H141.3L175.467,35L141.3,69.133H100.983ZM63.4,28.173C68.867,28.173 73.65,30.221 77.067,33.635L96.883,54.115C98.25,54.797 99.617,55.48 100.983,55.48H135.833L149.5,41.827H112.6C107.133,41.827 102.35,39.779 98.933,36.365L79.117,15.885C77.75,15.203 76.383,14.52 75.017,14.52H40.167L26.5,28.173H63.4Z" fill-rule="evenodd"/>
  </defs>
  <g transform="translate(0 -16)">
    <!-- track -->
    <g fill="#3B332C"><rect x="6" y="220" width="16" height="6" rx="1"/><rect x="40" y="220" width="16" height="6" rx="1"/><rect x="74" y="220" width="16" height="6" rx="1"/><rect x="108" y="220" width="16" height="6" rx="1"/><rect x="142" y="220" width="16" height="6" rx="1"/><rect x="176" y="220" width="16" height="6" rx="1"/><rect x="210" y="220" width="16" height="6" rx="1"/><rect x="244" y="220" width="12" height="6" rx="1"/></g>
    <rect x="0" y="213" width="256" height="7" fill="url(#rail)"/>
    <g filter="url(#sh)">
      <!-- underframe -->
      <rect x="22" y="182" width="234" height="14" fill="#2E3135"/>
      <rect x="122" y="192" width="104" height="14" rx="2" fill="#3C4045"/>
      <path d="M150 194V204M176 194V204M202 194V204" stroke="#26282C" stroke-width="2"/>
      <!-- bogie -->
      <rect x="36" y="194" width="68" height="10" rx="3" fill="#2A2C30"/>
      <circle cx="52" cy="206" r="10" fill="url(#wheel)"/><circle cx="88" cy="206" r="10" fill="url(#wheel)"/>
      <circle cx="52" cy="206" r="3" fill="#8A9097"/><circle cx="88" cy="206" r="3" fill="#8A9097"/>
      <!-- coupler skirt at the nose -->
      <path d="M4 168H26V200H10Q4 200 4 194Z" fill="#2A2C30"/>
      <!-- body -->
      <path d="M20 94H256V186H22Q10 186 10 174V106Q10 94 20 94Z" fill="url(#yel)"/>
      <!-- roof with raised cab (hump) and long ramp -->
      <path d="M10 108V92Q12 64 34 60H86Q98 60 108 66L162 96H256V106H10Z" fill="url(#roof)"/>
      <!-- wraparound windscreen at the front of the hump -->
      <path d="M12 92Q14 72 30 68H48L42 92Z" fill="url(#glass)"/>
      <path d="M16 84Q18 72 30 70H40L38 76Q24 76 16 84Z" fill="#fff" opacity=".2"/>
    </g>
    <!-- thin yellow stripe under roof line -->
    <rect x="10" y="106" width="246" height="3" fill="#FFE27A"/>
    <!-- blue window band -->
    <rect x="62" y="110" width="194" height="36" fill="url(#blue)"/>
    <!-- door near cab -->
    <rect x="66" y="108" width="22" height="76" rx="2" fill="url(#yel)" stroke="#2B2E33" stroke-width="2"/>
    <rect x="70" y="114" width="14" height="24" rx="2" fill="#1F4EAE" stroke="#2B2E33" stroke-width="1.5"/>
    <!-- windows -->
    <g stroke="#1B1E23" stroke-width="2">
      <rect x="98" y="116" width="26" height="22" rx="3" fill="url(#win)"/>
      <rect x="134" y="116" width="26" height="22" rx="3" fill="url(#win)"/>
      <rect x="170" y="116" width="26" height="22" rx="3" fill="#56616D"/>
      <rect x="206" y="116" width="26" height="22" rx="3" fill="url(#win)"/>
      <rect x="242" y="116" width="26" height="22" rx="3" fill="url(#win)"/>
    </g>
    <!-- cab side: marker + headlight -->
    <rect x="12" y="114" width="6" height="8" rx="2" fill="#2B2E33"/>
    <circle cx="17" cy="170" r="4.5" fill="#F4F6F8" stroke="#2B2E33" stroke-width="1.5"/>
    <path d="M44 112V180" stroke="#B98300" stroke-width="1.5" opacity=".7"/>
    <!-- NS logo + number -->
    <use href="#ns" fill="#15171A" transform="translate(134 154) scale(.3)"/>
    <text x="206" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#2B2E33">4015</text>
    <text x="126" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
