    <radialGradient id="led" cx="206" cy="220" r="6" gradientUnits="userSpaceOnUse" fx="205" fy="218">
      <stop offset="0" stop-color="#D8FFE0"/><stop offset="0.5" stop-color="#3CE07A"/><stop offset="1" stop-color="#138A3E"/>
    </radialGradient>
