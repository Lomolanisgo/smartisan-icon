  </defs>
  <!-- speed streaks -->
  <g stroke="url(#streak)" stroke-linecap="round">
    <line x1="10" y1="96" x2="70" y2="96" stroke-width="8"/>
    <line x1="4" y1="132" x2="58" y2="132" stroke-width="10"/>
    <line x1="18" y1="168" x2="70" y2="168" stroke-width="7"/>
  </g>
  <ellipse cx="150" cy="232" rx="78" ry="11" fill="url(#ground)"/>
  <circle cx="150" cy="132" r="92" fill="url(#scales)"/>
  <circle cx="150" cy="132" r="92" fill="url(#shade)"/>
  <circle cx="150" cy="132" r="91.5" fill="none" stroke="#0A3F32" stroke-opacity="0.5"/>
