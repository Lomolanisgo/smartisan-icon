<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="yel" cx=".42" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFE580"/><stop offset=".5" stop-color="#FFC21F"/><stop offset="1" stop-color="#F08C12"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46437A"/><stop offset="1" stop-color="#1E1C38"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="fsh" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/><feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="128" cy="238" rx="46" ry="9" fill="url(#ground)"/>
  <path d="M128 236C112 206 44 170 44 96A84 84 0 0 1 212 96C212 170 144 206 128 236Z" fill="url(#navy)"/>
  <path d="M128 213C114 189 58 160 58 96A70 70 0 0 1 198 96C198 160 142 189 128 213Z" fill="url(#yel)"/>
  <!-- inner rim shade -->
  <path d="M128 213C114 189 58 160 58 96A70 70 0 0 1 198 96C198 160 142 189 128 213Z" fill="none" stroke="#B85F00" stroke-opacity=".35" stroke-width="3"/>
  <!-- face -->
  <g filter="url(#fsh)" fill="none" stroke="#2D2B4E" stroke-width="8" stroke-linecap="round">
    <circle cx="106" cy="98" r="12"/><circle cx="150" cy="98" r="12"/>
    <path d="M98 128Q128 148 158 128"/>
  </g>
  <!-- gloss -->
  <path d="M70 80Q76 36 128 32Q180 36 186 80Q160 62 128 62Q96 62 70 80Z" fill="url(#gloss)" opacity=".75"/>
  <path d="M60 60Q92 14 150 16" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
</svg>
