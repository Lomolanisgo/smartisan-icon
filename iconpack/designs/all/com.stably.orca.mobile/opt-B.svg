<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#9DA2AA"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="20" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="1" stop-color="#3E5670"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="140" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D5C86"/>
      <stop offset="1" stop-color="#0A1E33"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="60" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3D44"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2DA"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="106"/></clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="130" r="116" fill="#000" opacity="0.15"/>
  <circle cx="128" cy="128" r="116" fill="url(#rim)"/>
  <g clip-path="url(#disc)">
    <rect width="256" height="150" fill="url(#sky)"/>
    <rect y="146" width="256" height="110" fill="url(#sea)"/>
    <path d="M0 150 Q32 144 64 150 T128 150 T192 150 T256 150" fill="none" stroke="#9FD4F0" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M20 176 Q50 172 80 176 M150 190 Q180 186 210 190 M60 212 Q90 208 120 212" fill="none" stroke="#9FD4F0" stroke-opacity="0.25" stroke-width="2"/>
    <!-- leaping orca -->
    <g>
      <path d="M46 168 C62 110 116 72 170 78 C196 81 214 96 222 112 C206 106 194 110 186 118 C160 104 120 112 96 140 C84 154 74 166 70 178 Z" fill="url(#body)"/>
      <!-- dorsal fin -->
      <path d="M126 92 C130 66 142 46 156 34 C154 54 154 70 160 82 Z" fill="url(#body)"/>
      <!-- belly white -->
      <path d="M96 140 C120 112 160 104 186 118 C170 124 150 126 132 134 C118 140 106 148 96 160 Z" fill="url(#belly)"/>
      <!-- eye patch -->
      <ellipse cx="190" cy="94" rx="11" ry="5" transform="rotate(18 190 94)" fill="url(#belly)"/>
      <!-- saddle -->
      <path d="M110 104 C122 96 136 92 146 94 C136 100 124 104 110 110 Z" fill="#8E949C" opacity="0.8"/>
      <!-- pectoral fin -->
      <path d="M150 124 C150 140 142 152 132 158 C136 146 138 136 140 126 Z" fill="#0A0A0C"/>
      <path d="M58 150 C80 110 120 84 166 82" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- splash -->
    <path d="M40 176 C50 160 58 162 62 150 C66 164 76 166 86 160 C80 172 70 176 60 178 Z" fill="#DFF3FF" opacity="0.85"/>
    <circle cx="36" cy="148" r="3" fill="#DFF3FF" opacity="0.8"/>
    <circle cx="90" cy="150" r="2.5" fill="#DFF3FF" opacity="0.8"/>
    <path d="M22 110 C30 60 76 26 128 24 C180 26 226 60 234 110 C200 92 164 86 128 86 C92 86 56 92 22 110 Z" fill="url(#gloss)"/>
  </g>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
</svg>
