  <g fill="#C9CBCD" stroke="#55585B" stroke-width="0.7">
    <rect x="196" y="64" width="9" height="6" rx="1"/><rect x="196" y="74" width="9" height="6" rx="1"/>
    <rect x="196" y="84" width="9" height="6" rx="1"/><rect x="196" y="94" width="9" height="6" rx="1"/>
    <rect x="196" y="104" width="9" height="6" rx="1"/>
  </g>
  <rect x="211" y="64" width="17" height="46" rx="2" fill="#0F1011" stroke="#55585B" stroke-width="0.7"/>
  <g fill="#8FD4FF" fill-opacity="0.35"><rect x="214" y="68" width="11" height="3"/><rect x="214" y="76" width="11" height="3"/><rect x="214" y="84" width="11" height="3"/></g>
  <!-- small knobs -->
  <circle cx="201" cy="122" r="4.5" fill="#B7B9BB" stroke="#4E5053" stroke-width="0.8"/>
  <circle cx="221" cy="122" r="4.5" fill="#B7B9BB" stroke="#4E5053" stroke-width="0.8"/>
