<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Uber · 圆形 C：沿用锤子原图（白色圆盘 + 深灰 U 形标），按新的圆形规格重绘（直径 248） -->
  <defs>
    <radialGradient id="ball" cx="104" cy="60" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#EEEEEF"/><stop offset="1" stop-color="#CFD0D3"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#BDBEC2"/><stop offset="1" stop-color="#9A9CA1"/>
    </linearGradient>
    <linearGradient id="u" x1="0" y1="70" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4B50"/><stop offset="1" stop-color="#232427"/>
    </linearGradient>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dy="-1.5"/><feGaussianBlur stdDeviation="0.8"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/><feComposite operator="in" in2="SourceGraphic" result="shadow"/>
      <feOffset in="SourceAlpha" dy="1.5" result="lowAlpha"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/><feComposite operator="out" in2="SourceAlpha"/>
      <feComposite operator="in" in2="lowAlpha" result="lip"/>
      <feMerge><feMergeNode in="lip"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="128" cy="128" r="124"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#ball)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="32" rx="140" ry="90" fill="#fff" opacity="0.35"/>
    <circle cx="128" cy="128" r="123" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="119" fill="none" stroke="#000" stroke-opacity="0.05" stroke-width="3"/>
  </g>
  <!-- U mark: full-height left bar, shorter right bar with the notch at top-right, rounded bottom corners -->
  <path d="M78 78H100V156C100 164 104 168 112 168H144C152 168 156 164 156 156V100H146V78H178V160C178 178 168 190 150 190H106C88 190 78 178 78 160Z" fill="url(#u)" filter="url(#inset)"/>
</svg>
