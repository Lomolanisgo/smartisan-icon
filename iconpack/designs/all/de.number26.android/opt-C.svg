<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="card"><rect x="4" y="50" width="248" height="156" rx="14"/></clipPath>
    <linearGradient id="frost" x1="0" y1="50" x2="0" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFBFB"/><stop offset="1" stop-color="#DCDFE2"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="58" x2="0" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2626"/><stop offset="1" stop-color="#0D0B0B"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F5F6"/><stop offset="0.45" stop-color="#B9BDC2"/><stop offset="0.7" stop-color="#E6E8EA"/><stop offset="1" stop-color="#9DA2A8"/>
    </linearGradient>
    <radialGradient id="holo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C8CBD0"/><stop offset="1" stop-color="#8E939A"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9AD5" stop-opacity="0.35"/><stop offset="0.35" stop-color="#9AE7FF" stop-opacity="0.35"/><stop offset="0.7" stop-color="#FFF19A" stop-opacity="0.35"/><stop offset="1" stop-color="#B69AFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="red"><circle cx="207" cy="182" r="15"/></clipPath>
  </defs>

  <!-- soft contact shadow -->
  <ellipse cx="128" cy="210" rx="112" ry="7" fill="#000" opacity="0.18" filter="url(#blur3)"/>

  <!-- frosted translucent body -->
  <rect x="4" y="50" width="248" height="156" rx="14" fill="url(#frost)" fill-opacity="0.86"/>
  <g clip-path="url(#card)">
    <!-- shapes seen blurred through the card -->
    <path d="M-10,230 C40,170 90,160 150,190 C190,210 220,200 270,160 V240 H-10Z" fill="#5E6770" opacity="0.16" filter="url(#blur6)"/>
    <ellipse cx="70" cy="178" rx="46" ry="22" fill="#6C747C" opacity="0.10" filter="url(#blur6)"/>
    <!-- refraction sheen -->
    <path d="M96,40 L136,40 L60,220 L20,220Z" fill="url(#sheen)" opacity="0.45" filter="url(#blur3)"/>
    <!-- black band -->
    <rect x="0" y="58" width="256" height="44" fill="url(#band)"/>
    <rect x="0" y="58" width="256" height="1" fill="#FFFFFF" opacity="0.18"/>
  </g>

