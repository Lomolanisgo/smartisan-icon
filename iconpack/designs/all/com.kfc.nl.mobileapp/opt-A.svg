<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <path id="tile" d="M47 3.06H208.93C227.73 3.06 232.93 8.26 232.93 27.06V228.94C232.93 247.74 227.73 252.94 208.93 252.94H47C28.2 252.94 23 247.74 23 228.94V27.06C23 8.26 28.2 3.06 47 3.06Z"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
    <linearGradient id="fill" x1="0" y1="3" x2="0" y2="253" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0263A"/><stop offset="1" stop-color="#C8081E"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="40" x2="0" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECECEC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="3" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#500008" flood-opacity="0.45"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#fill)"/>
  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#gloss)"/>
    <g fill="none">
      <use href="#tile" stroke="#4A0000" stroke-opacity="0.15" stroke-width="5"/>
      <use href="#tile" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" transform="translate(0 1)"/>
      <use href="#tile" stroke="#9A0614" stroke-width="2"/>
    </g>
  </g>
  <!-- bucket badge -->
  <path d="M48 40H208L191 218Q190 228 180 228H76Q66 228 65 218Z" fill="url(#badge)" filter="url(#sh)"/>
  <path d="M60 52H84V160H70Z" fill="#E4002B"/>
  <path d="M196 52H172V160H186Z" fill="#E4002B"/>
  <!-- Colonel -->
  <g stroke="#111111" stroke-linejoin="round" stroke-linecap="round">
    <!-- collar / shirt -->
    <path d="M100 162L128 176L156 162" fill="none" stroke-width="3.5"/>
    <!-- hair puffs -->
    <path d="M100 92C98 80 104 72 110 68C114 60 122 57 128 57C134 57 142 60 146 68C152 72 158 80 156 92C150 84 142 80 128 80C114 80 106 84 100 92Z" fill="#FFFFFF" stroke-width="3.5"/>
