    <use href="#tile" stroke="#000" stroke-opacity="0.18" stroke-width="5"/>
    <use href="#tile" stroke="#000" stroke-opacity="0.22" stroke-width="4" transform="translate(0 -1.5)"/>
    <use href="#tile" stroke="#6C7384" stroke-opacity="0.7" stroke-width="2" transform="translate(0 1)"/>
    <use href="#tile" stroke="url(#tileRim)" stroke-width="2"/>
  </g>
  <!-- Samsung Settings gear (traced 1:1), 211px → 150px uniform, centred; windows/hub stay see-through to the tile -->
  <g transform="translate(-25.1 -25.1) scale(0.711)">
    <g filter="url(#sh)"><use href="#gear" fill="url(#face)"/></g>
    <use href="#rim" fill="url(#silver)" filter="url(#inner)"/>
    <use href="#rim" fill="url(#silver)"/>
  </g>
</svg>
