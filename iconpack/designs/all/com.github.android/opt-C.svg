<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 官方 GitHub 标志路径（来自 phone-icons/com.github.android.svg）：黑色圆盘，Octocat 为镂空。包围盒 x 0–44，y 0.5–43.6 -->
    <path id="cat" fill-rule="evenodd" d="M22,0.5C9.845,0.5 0,10.3646 0,22.5438C0,32.2982 6.2975,40.5371 15.0425,43.4579C16.1425,43.6508 16.555,42.9895 16.555,42.4108C16.555,41.8873 16.5275,40.1513 16.5275,38.3051C11,39.3247 9.57,36.955 9.13,35.715C8.8825,35.0812 7.81,33.1248 6.875,32.6013C6.105,32.188 5.005,31.1685 6.8475,31.1409C8.58,31.1134 9.8175,32.7391 10.23,33.4004C12.21,36.7345 15.3725,35.7977 16.6375,35.219C16.83,33.7862 17.4075,32.8217 18.04,32.2707C13.145,31.7196 8.03,29.8183 8.03,21.3865C8.03,18.9893 8.8825,17.0053 10.285,15.4622C10.065,14.9111 9.295,12.6517 10.505,9.6206C10.505,9.6206 12.3475,9.042 16.555,11.8801C18.315,11.3841 20.185,11.1361 22.055,11.1361C23.925,11.1361 25.795,11.3841 27.555,11.8801C31.7625,9.0144 33.605,9.6206 33.605,9.6206C34.815,12.6517 34.045,14.9111 33.825,15.4622C35.2275,17.0053 36.08,18.9617 36.08,21.3865C36.08,29.8458 30.9375,31.7196 26.0425,32.2707C26.84,32.9595 27.5275,34.2822 27.5275,36.3488C27.5275,39.2971 27.5,41.6668 27.5,42.4108C27.5,42.9895 27.9125,43.6783 29.0125,43.4579C37.7025,40.5371 44,32.2707 44,22.5438C44,10.3646 34.155,0.5 22,0.5Z"/>
    <!-- 圆盘外形（标志的外圆） -->
    <circle id="disc" cx="22" cy="22.54" r="22"/>
    <clipPath id="catClip"><use href="#cat"/></clipPath>

    <!-- 黑色正面：上亮下深的炭黑 -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454D56"/>
      <stop offset="0.4" stop-color="#2A3038"/>
      <stop offset="1" stop-color="#14181D"/>
    </linearGradient>
    <!-- 侧面厚度 -->
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <!-- 猫形镶嵌的白色 -->
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DCE3"/>
    </linearGradient>
    <!-- 外沿浅色边缘高光（深色桌面上保证轮廓），上亮下暗 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8E0E8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#8E99A5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6F7A86" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 滤镜单位为局部坐标（×5.2 后为像素） -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.35"/></filter>
  </defs>

  <!-- 圆盘直径约 229，居中略偏上 -->
  <g transform="translate(13.6 4.8) scale(5.2)">
    <!-- 地面投影 -->
    <use href="#disc" transform="translate(0 1.9)" fill="#000" fill-opacity="0.32" filter="url(#shadow)"/>
    <!-- 侧面外沿的浅色勾边（深色桌面上可见厚度轮廓） -->
    <use href="#disc" transform="translate(0 1.4)" fill="none" stroke="#8592A0" stroke-width="0.5" stroke-opacity="0.75"/>
    <!-- 厚度：向下挤出 -->
    <use href="#disc" transform="translate(0 1.4)" fill="url(#side)"/>
    <use href="#disc" transform="translate(0 0.7)" fill="#0E1216"/>
    <!-- 白色镶嵌层（透过猫形镂空显示） -->
    <use href="#disc" fill="url(#white)"/>
    <!-- 猫形镶嵌内侧的柔和阴影（让白色略微下凹） -->
    <use href="#cat" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.4" filter="url(#softBlur)"/>
    <!-- 黑色正面 -->
    <use href="#cat" fill="url(#face)"/>
    <g clip-path="url(#catClip)">
      <!-- 正面内侧暗边 -->
      <use href="#cat" fill="none" stroke="#000" stroke-width="2.4" stroke-opacity="0.45" filter="url(#innerBlur)"/>
      <!-- 上沿窄高光 -->
      <use href="#cat" transform="translate(0 0.45)" fill="none" stroke="#B4C0CC" stroke-width="0.8" stroke-opacity="0.8" filter="url(#softBlur)"/>
      <!-- 顶部釉面反光 -->
      <ellipse cx="22" cy="6.5" rx="17.5" ry="8" fill="url(#gloss)"/>
    </g>
    <!-- 外沿浅色边缘高光 -->
    <use href="#disc" fill="none" stroke="url(#rim)" stroke-width="0.45"/>
  </g>
</svg>
