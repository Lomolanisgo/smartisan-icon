<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 锤子图标包 App logo：红色圆形 + 白色 T 形锤子（按 _ref-t-hammer.png 重绘，圆直径 248 = 方形 226 × 1.10） -->
  <defs>
    <radialGradient id="ball" cx="92" cy="64" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7766A"/>
      <stop offset="0.45" stop-color="#EA4A3F"/>
      <stop offset="1" stop-color="#C92A22"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A90" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#B8201A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8E130E" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="metal" x1="66" y1="0" x2="188" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBF8F7"/>
      <stop offset="1" stop-color="#E4DEDC"/>
    </linearGradient>
    <linearGradient id="handleShade" x1="116" y1="0" x2="142" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E1A14" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="1" dy="4" result="b"/>
      <feFlood flood-color="#7A120C" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ballClip"><circle cx="128" cy="128" r="124"/></clipPath>
    <path id="hammer" d="M80 51C110 49.5 150 49.5 166 52C177 55 184.5 66 187 79C178 76.5 165 79 142 80L141 204C141 213 136.5 218 131.5 218C126.5 218 122.5 214 122 206C120.5 160 119.5 112 116.5 81L88 81C76 81 67 74.5 67 66C67 57 73 51 80 51Z"/>
  </defs>

  <!-- ball -->
  <circle cx="128" cy="128" r="124" fill="url(#ball)"/>
  <g clip-path="url(#ballClip)">
    <ellipse cx="128" cy="30" rx="150" ry="98" fill="url(#gloss)"/>
    <circle cx="128" cy="128" r="123" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>

  <!-- T hammer -->
  <g filter="url(#drop)">
    <use href="#hammer" fill="url(#metal)"/>
  </g>
  <use href="#hammer" fill="url(#handleShade)"/>
  <path d="M80 52.5C110 51 150 51 165.5 53.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
</svg>
