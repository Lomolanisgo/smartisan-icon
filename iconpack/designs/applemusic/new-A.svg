<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a66"/>
      <stop offset="0.45" stop-color="#f01a30"/>
      <stop offset="1" stop-color="#b8081e"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c0c22"/>
      <stop offset="1" stop-color="#ff6b7c"/>
    </linearGradient>
    <radialGradient id="base" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#f52238"/>
      <stop offset="0.6" stop-color="#d40f28"/>
      <stop offset="1" stop-color="#860013"/>
    </radialGradient>
    <pattern id="mesh" width="7" height="12.124" patternUnits="userSpaceOnUse">
      <g fill="#ff8a98" opacity="0.55">
        <circle cx="0" cy="0.7" r="2.5"/><circle cx="7" cy="0.7" r="2.5"/><circle cx="3.5" cy="6.762" r="2.5"/><circle cx="0" cy="12.824" r="2.5"/><circle cx="7" cy="12.824" r="2.5"/>
      </g>
      <g fill="#6e0414" opacity="0.85">
        <circle cx="0" cy="0" r="2.4"/><circle cx="7" cy="0" r="2.4"/><circle cx="3.5" cy="6.062" r="2.4"/><circle cx="0" cy="12.124" r="2.4"/><circle cx="7" cy="12.124" r="2.4"/>
      </g>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a0008" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6ea"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lsh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)"><circle cx="128" cy="126" r="120" fill="url(#rim)"/></g>
  <path d="M28 110 A101 101 0 0 1 228 110 A118 118 0 0 0 28 110 Z" fill="url(#gloss)" opacity="0.6"/>
  <circle cx="128" cy="128" r="107" fill="url(#groove)"/>
  <circle cx="128" cy="128" r="104" fill="url(#base)"/>
  <g clip-path="url(#disc)">
    <rect x="20" y="20" width="216" height="216" fill="url(#mesh)"/>
    <circle cx="128" cy="128" r="104" fill="url(#vig)"/>
    <ellipse cx="128" cy="62" rx="110" ry="70" fill="url(#glow)"/>
  </g>
  <g filter="url(#lsh)" transform="translate(128 129) scale(1.12) translate(-116 -117)">
    <path fill="url(#ink)" d="M100 68 L170 50 L170 150 A25 19 -22 1 1 159 131 L159 76 L111 88 L111 164 A25 19 -22 1 1 100 145 Z"/>
  </g>
