    <filter id="dsh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.22"/></filter>
  </defs>
  <use href="#page" fill="url(#paper)" filter="url(#dsh)"/>
  <g clip-path="url(#pc)">
