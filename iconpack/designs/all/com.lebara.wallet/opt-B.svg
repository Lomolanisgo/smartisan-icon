<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <path id="card" d="M52 20H170L212 62V222C212 232 206 238 196 238H52C42 238 36 232 36 222V36C36 26 42 20 52 20Z"/>
    <linearGradient id="plastic" x1="36" y1="20" x2="212" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34C4FF"/><stop offset="0.5" stop-color="#00A3E0"/><stop offset="1" stop-color="#0079BD"/>
    </linearGradient>
    <linearGradient id="chip" x1="70" y1="92" x2="178" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.35" stop-color="#E9C45A"/><stop offset="0.7" stop-color="#C69A2A"/><stop offset="1" stop-color="#F0D27A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="20" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc"><use href="#card"/></clipPath>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#00304F" flood-opacity="0.35"/>
    </filter>
    <filter id="in" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#6A4A00" flood-opacity="0.7"/>
    </filter>
  </defs>
  <use href="#card" fill="url(#plastic)" filter="url(#ds)"/>
  <g clip-path="url(#cc)">
    <path d="M20 20H240V110C180 80 100 90 20 130Z" fill="url(#gloss)"/>
    <use href="#card" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3" transform="translate(0 1)"/>
    <use href="#card" fill="none" stroke="#005A8C" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <!-- chip -->
  <g filter="url(#in)">
    <rect x="72" y="84" width="104" height="84" rx="14" fill="url(#chip)"/>
    <g fill="none" stroke="#8C6A12" stroke-width="2.2" stroke-opacity="0.75">
      <rect x="72" y="84" width="104" height="84" rx="14"/>
      <path d="M72 112H104M72 140H104M144 112H176M144 140H176M124 84V100M124 152V168"/>
      <rect x="104" y="100" width="40" height="52" rx="7"/>
    </g>
  </g>
  <text x="124" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="700" font-size="30" letter-spacing="0.5" fill="#fff">LEBARA</text>
  <text x="124" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="600" font-size="14" fill="#fff" fill-opacity="0.75" letter-spacing="3">WALLET</text>
</svg>
