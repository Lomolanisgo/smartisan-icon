<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6AF2D2"/>
      <stop offset="1" stop-color="#1E9C7C"/>
    </linearGradient>
    <pattern id="scales" width="26" height="20" patternUnits="userSpaceOnUse" patternTransform="translate(6 4) rotate(-18)">
      <rect width="26" height="20" fill="#146E57"/>
      <path d="M0 0 Q13 28 26 0 Z" fill="url(#sc)" stroke="#0D5443" stroke-width="1.2"/>
      <path d="M-13 10 Q0 38 13 10 Z" fill="url(#sc)" stroke="#0D5443" stroke-width="1.2"/>
      <path d="M13 10 Q26 38 39 10 Z" fill="url(#sc)" stroke="#0D5443" stroke-width="1.2"/>
    </pattern>
    <radialGradient id="shade" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#001A12" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3ED8B4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ED8B4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9AFFE6"/>
      <stop offset="1" stop-color="#35C4A2"/>
