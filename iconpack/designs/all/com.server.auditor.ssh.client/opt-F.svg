  <!-- graphite terminal body -->
  <use href="#tile" fill="url(#body)"/>
  <g clip-path="url(#clip)" fill="none">
    <ellipse cx="128" cy="12" rx="190" ry="70" fill="#fff" opacity="0.08"/>
    <use href="#tile" stroke="#000" stroke-opacity="0.35" stroke-width="5"/>
    <use href="#tile" stroke="#fff" stroke-opacity="0.25" stroke-width="2" transform="translate(0 1)"/>
    <use href="#tile" stroke="#0E0F12" stroke-width="2"/>
  </g>
  <!-- recessed bezel -->
  <rect x="30" y="28" width="196" height="178" rx="21" fill="url(#bezel)"/>
  <!-- screen -->
  <use href="#screen" fill="url(#glass)"/>
  <g clip-path="url(#screenClip)">
    <rect x="36" y="34" width="184" height="166" fill="url(#bloom)"/>
    <g transform="translate(33.5 29) scale(1.75)" fill="#EAF0FF" filter="url(#glow)">
      <use href="#ring"/>
      <g transform="translate(53.7 54) scale(1.7) translate(-53.7 -53.8)"><use href="#glyph"/></g>
    </g>
    <rect x="36" y="34" width="184" height="166" fill="url(#scan)"/>
    <!-- glass reflection -->
    <path d="M36 34H220V96C170 84 100 88 36 118Z" fill="#fff" opacity="0.07"/>
    <use href="#screen" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="6" filter="url(#blur)"/>
  </g>
  <use href="#screen" fill="none" stroke="#000" stroke-width="1"/>
  <!-- chin: vents + power LED -->
  <g fill="#131418">
    <rect x="42" y="217" width="40" height="4" rx="2"/>
    <rect x="42" y="226" width="40" height="4" rx="2"/>
  </g>
  <g fill="#6A6E78" opacity="0.6">
    <rect x="42" y="221" width="40" height="1"/>
    <rect x="42" y="230" width="40" height="1"/>
  </g>
  <circle cx="206" cy="222" r="8" fill="#101114"/>
  <circle cx="206" cy="222" r="5.5" fill="url(#led)"/>
  <circle cx="206" cy="222" r="10" fill="#3CE07A" opacity="0.18"/>
