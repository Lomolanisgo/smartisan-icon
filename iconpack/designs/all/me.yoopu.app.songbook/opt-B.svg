    <filter id="deb" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="-1.5" stdDeviation="0.6" flood-color="#6A1418" flood-opacity="0.7"/></filter>
  </defs>
  <use href="#pick" fill="url(#cel)" filter="url(#osh)"/>
