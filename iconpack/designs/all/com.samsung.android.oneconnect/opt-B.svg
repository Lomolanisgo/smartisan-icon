<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFD"/><stop offset="0.5" stop-color="#B9C0CA"/><stop offset="1" stop-color="#E9ECF1"/></linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E6672"/><stop offset="1" stop-color="#A7AEB8"/></linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.3" r="0.75"><stop offset="0" stop-color="#2C3F5C"/><stop offset="1" stop-color="#070C16"/></radialGradient>
    <linearGradient id="led" x1="0" y1="40" x2="0" y2="220" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B8EAFF"/><stop offset="1" stop-color="#2E8BFF"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <mask id="net" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g transform="translate(128 128) scale(0.8) translate(-128 -132)">
        <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
          <line x1="128" y1="132" x2="128" y2="60"/>
          <line x1="128" y1="132" x2="196.5" y2="109.8"/>
          <line x1="128" y1="132" x2="170.3" y2="190.2"/>
          <line x1="128" y1="132" x2="85.7" y2="190.2"/>
          <line x1="128" y1="132" x2="59.5" y2="109.8"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="128" cy="132" r="31"/>
          <circle cx="128" cy="60" r="20"/>
          <circle cx="196.5" cy="109.8" r="20"/>
          <circle cx="170.3" cy="190.2" r="20"/>
          <circle cx="85.7" cy="190.2" r="20"/>
          <circle cx="59.5" cy="109.8" r="20"/>
        </g>
        <g fill="#000000">
          <circle cx="128" cy="132" r="21"/>
          <circle cx="128" cy="60" r="12"/>
          <circle cx="196.5" cy="109.8" r="12"/>
          <circle cx="170.3" cy="190.2" r="12"/>
          <circle cx="85.7" cy="190.2" r="12"/>
          <circle cx="59.5" cy="109.8" r="12"/>
        </g>
      </g>
    </mask>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ds)">
    <circle cx="128" cy="126" r="116" fill="url(#metal)"/>
  </g>
  <circle cx="128" cy="126" r="115" fill="none" stroke="#8C94A0" stroke-opacity="0.5"/>
  <circle cx="128" cy="126" r="104" fill="url(#groove)"/>
  <circle cx="128" cy="126" r="101" fill="url(#glass)"/>
  <g transform="translate(0 -2)">
    <g filter="url(#glow)" opacity="0.9"><rect width="256" height="256" fill="#1E90FF" mask="url(#net)"/></g>
    <rect width="256" height="256" fill="url(#led)" mask="url(#net)"/>
  </g>
  <path d="M34 112A95 95 0 0 1 222 112C200 84 168 70 128 70C88 70 56 84 34 112Z" fill="url(#gloss)"/>
  <circle cx="128" cy="126" r="100.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
</svg>
