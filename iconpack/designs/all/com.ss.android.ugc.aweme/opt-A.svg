<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 官方抖音音符三层路径（来自 designs/douyin/final-douyin.svg，原为 108 坐标系）：红色错位层、青色错位层、白色主体 -->
    <path id="red" d="M78.47,50.46C73.76,50.46 69.4,48.95 65.83,46.38V64.87C65.83,74.1 58.34,81.6 49.11,81.6C45.83,81.6 42.76,80.65 40.17,79C39.96,78.86 39.75,78.72 39.54,78.57C35.23,75.54 32.4,70.53 32.4,64.87C32.4,55.63 39.89,48.13 49.11,48.13C49.88,48.13 50.63,48.2 51.36,48.29V57.58C50.65,57.36 49.9,57.23 49.11,57.23C44.91,57.23 41.49,60.66 41.49,64.88C41.49,67.81 43.14,70.36 45.57,71.64C45.69,71.69 45.81,71.75 45.92,71.81C46.9,72.26 47.98,72.51 49.11,72.51C53.22,72.51 56.58,69.23 56.73,65.15L56.75,28.71H65.83C65.83,29.5 65.91,30.27 66.04,31.01C66.68,34.47 68.73,37.44 71.58,39.31C71.74,39.41 71.92,39.52 72.09,39.62C73.96,40.72 76.14,41.36 78.47,41.36V50.46Z"/>
    <path id="cyan" d="M75.59,48.15C70.88,48.15 66.52,46.65 62.96,44.08V62.56C62.96,71.79 55.46,79.29 46.24,79.29C42.95,79.29 39.88,78.34 37.3,76.69C37.09,76.56 36.87,76.41 36.66,76.27C32.35,73.24 29.52,68.22 29.52,62.56C29.52,53.33 37.02,45.83 46.24,45.83C47,45.83 47.75,45.89 48.49,45.99V55.28C47.77,55.06 47.02,54.92 46.24,54.92C42.03,54.92 38.61,58.35 38.61,62.57C38.61,65.5 40.27,68.06 42.7,69.33C42.82,69.39 42.93,69.45 43.05,69.5C44.02,69.96 45.1,70.21 46.24,70.21C50.35,70.21 53.71,66.93 53.86,62.85L53.88,26.4H62.96C62.96,27.19 63.03,27.96 63.17,28.71C63.8,32.17 65.86,35.14 68.7,37C68.87,37.11 69.04,37.21 69.22,37.32C71.09,38.42 73.27,39.05 75.59,39.05V48.15Z"/>
    <path id="core" d="M62.97,62.56C62.97,71.79 55.47,79.29 46.25,79.29C42.96,79.29 39.89,78.34 37.31,76.69C34.28,73.66 32.41,69.48 32.41,64.87C32.41,55.85 39.58,48.47 48.5,48.14V55.27C47.78,55.05 47.03,54.91 46.25,54.91C42.04,54.91 38.62,58.35 38.62,62.56C38.62,65.49 40.28,68.05 42.71,69.32C42.83,69.38 42.94,69.44 43.06,69.5C43.73,70.38 44.59,71.12 45.58,71.64C46.65,72.2 47.85,72.51 49.12,72.51C53.23,72.51 56.59,69.23 56.74,65.15L56.76,28.71H63.19C63.82,32.17 65.88,35.14 68.72,37C68.89,37.11 69.06,37.21 69.23,37.32C69.94,38.07 70.73,38.75 71.6,39.31C72.8,40.11 74.16,40.69 75.6,41.03V48.15C70.89,48.15 66.53,46.65 62.97,44.08V62.56Z"/>
    <clipPath id="coreClip"><use href="#core"/></clipPath>
    <clipPath id="cyanClip"><use href="#cyan"/></clipPath>
    <clipPath id="redClip"><use href="#red"/></clipPath>

    <linearGradient id="redG" x1="0" y1="26" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7591"/><stop offset="0.5" stop-color="#F52A52"/><stop offset="1" stop-color="#CF0F38"/>
    </linearGradient>
    <linearGradient id="redSide" x1="0" y1="26" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A40E2D"/><stop offset="1" stop-color="#66071C"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0" y1="26" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FFFFB"/><stop offset="0.5" stop-color="#28E4DE"/><stop offset="1" stop-color="#0FBDB7"/>
    </linearGradient>
    <linearGradient id="cyanSide" x1="0" y1="26" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B8F8A"/><stop offset="1" stop-color="#065855"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0" y1="28" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F3F3F6"/><stop offset="1" stop-color="#DEDFE5"/>
    </linearGradient>
    <radialGradient id="gloss" cx="52" cy="36" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 模糊值按 scale 4.1 换算：5px≈1.2，3px≈0.75，2px≈0.5 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="1.25"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.75"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.4"/></filter>
  </defs>

  <!-- 音符高约 226px，居中略偏上；厚度 8px（1.95 单位），投影偏移 11px -->
  <g transform="translate(128 118) scale(4.1) translate(-54 -54)">
    <!-- 地面投影 -->
    <g transform="translate(0 2.7)" fill="#000" fill-opacity="0.33" filter="url(#shadow)">
      <use href="#red"/><use href="#cyan"/>
    </g>
    <!-- 厚度：红层深红、青层深青，逐层向下挤出 -->
    <g>
      <g transform="translate(0 1.95)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 1.7)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 1.45)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 1.2)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 0.95)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 0.7)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 0.45)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
      <g transform="translate(0 0.2)"><use href="#red" fill="url(#redSide)"/><use href="#cyan" fill="url(#cyanSide)"/></g>
    </g>
    <!-- 外轮廓暗线（在浅色桌面上给整体一个边） -->
    <g fill="none" stroke="#14151C" stroke-opacity="0.55" stroke-width="0.6" stroke-linejoin="round">
      <use href="#red"/><use href="#cyan"/>
    </g>
    <!-- 红色错位层 -->
    <use href="#red" fill="url(#redG)"/>
    <g clip-path="url(#redClip)">
      <use href="#red" fill="none" stroke="#B0102F" stroke-opacity="0.45" stroke-width="1.2" filter="url(#innerBlur)"/>
      <use href="#red" transform="translate(0 0.45)" fill="none" stroke="#FFC5D0" stroke-opacity="0.85" stroke-width="0.5" filter="url(#softBlur)"/>
    </g>
    <!-- 青色错位层 -->
    <use href="#cyan" fill="url(#cyanG)"/>
    <g clip-path="url(#cyanClip)">
      <use href="#cyan" fill="none" stroke="#0A8F8A" stroke-opacity="0.45" stroke-width="1.2" filter="url(#innerBlur)"/>
      <use href="#cyan" transform="translate(0 0.45)" fill="none" stroke="#E6FFFE" stroke-opacity="0.9" stroke-width="0.5" filter="url(#softBlur)"/>
    </g>
    <!-- 白色音符主体 -->
    <use href="#core" fill="url(#coreG)"/>
    <g clip-path="url(#coreClip)">
      <!-- 内侧柔和暗边 -->
      <use href="#core" fill="none" stroke="#8F909C" stroke-opacity="0.35" stroke-width="1.4" filter="url(#innerBlur)"/>
      <!-- 下沿暗带 -->
      <use href="#core" transform="translate(0 -0.8)" fill="none" stroke="#9A9BA8" stroke-opacity="0.45" stroke-width="0.8" filter="url(#softBlur)"/>
      <!-- 上沿高光 -->
      <use href="#core" transform="translate(0 0.8)" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="0.7" filter="url(#softBlur)"/>
      <!-- 顶部光斑 -->
      <ellipse cx="55" cy="36" rx="14" ry="12" fill="url(#gloss)"/>
    </g>
    <!-- 主体与彩色层交界的细线 -->
    <use href="#core" fill="none" stroke="#4A4B57" stroke-opacity="0.35" stroke-width="0.25"/>
  </g>
</svg>
