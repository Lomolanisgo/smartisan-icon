<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ring" x1="0" y1="12" x2="0" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBCBCB"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="24" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4E4E4"/><stop offset="1" stop-color="#FBFBFB"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="36" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E747C"/><stop offset="0.5" stop-color="#474C53"/><stop offset="1" stop-color="#26292D"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="90" x2="0" y2="166" gradientUnits="userSpaceOnUse">
