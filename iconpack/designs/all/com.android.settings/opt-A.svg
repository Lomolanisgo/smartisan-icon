      <g id="t"><rect x="115" y="42" width="26" height="36" rx="5"/></g>
      <use href="#t" transform="rotate(45 128 128)"/><use href="#t" transform="rotate(90 128 128)"/>
      <use href="#t" transform="rotate(135 128 128)"/><use href="#t" transform="rotate(180 128 128)"/>
      <use href="#t" transform="rotate(225 128 128)"/><use href="#t" transform="rotate(270 128 128)"/>
      <use href="#t" transform="rotate(315 128 128)"/>
