    </linearGradient>
    <linearGradient id="col" x1="0" y1="58" x2="0" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E3033"/><stop offset="1" stop-color="#1B1C1E"/>
    </linearGradient>
    <clipPath id="sc"><path id="tube" d="M38 66H164C170 66 173 69 173.6 75C175 98 175 158 173.6 180C173 186 170 189 164 189H38C32 189 29 186 28.4 180C27 158 27 98 28.4 75C29 69 32 66 38 66Z"/></clipPath>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- cabinet silhouette (for the drop shadow) -->
  <rect x="4" y="44" width="248" height="168" rx="6" fill="#6B6E71" filter="url(#ds)"/>

  <!-- wood side panels -->
  <rect x="4" y="44" width="12" height="168" rx="5" fill="url(#wood)"/>
  <rect x="4" y="44" width="12" height="168" rx="5" fill="url(#grain)"/>
  <rect x="240" y="44" width="12" height="168" rx="5" fill="url(#wood)"/>
  <rect x="240" y="44" width="12" height="168" rx="5" fill="url(#grain)"/>

  <!-- silver front -->
  <rect x="14" y="44" width="228" height="168" fill="url(#front)"/>
  <rect x="14" y="44" width="228" height="168" fill="url(#brush)"/>
  <path d="M14 44.75H242" stroke="#E4E5E6" stroke-width="1.5"/>
  <path d="M14 211.25H242" stroke="#4E5053" stroke-width="1.5"/>

  <!-- screen bezel + tube -->
  <rect x="20" y="56" width="162" height="144" rx="8" fill="url(#bezel)"/>
  <rect x="20.5" y="56.5" width="161" height="143" rx="7.5" fill="none" stroke="#000" stroke-opacity="0.55"/>
  <use href="#tube" fill="url(#screen)"/>
  <g clip-path="url(#sc)">
    <g transform="translate(101 128) scale(0.6) translate(-96 -92)" fill="#fff" filter="url(#glow)">
      <use href="#logo"/>
    </g>
    <g stroke="#000" stroke-opacity="0.07" stroke-width="1">
      <path d="M24 72H178M24 79H178M24 86H178M24 93H178M24 100H178M24 107H178M24 114H178M24 121H178M24 128H178M24 135H178M24 142H178M24 149H178M24 156H178M24 163H178M24 170H178M24 177H178M24 184H178"/>
    </g>
    <path d="M24 62H178V98C130 92 76 96 24 114Z" fill="url(#glassV)"/>
  </g>
  <use href="#tube" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- right control column -->
  <rect x="190" y="56" width="44" height="144" rx="3" fill="url(#col)"/>
  <rect x="190.5" y="56.5" width="43" height="143" rx="2.5" fill="none" stroke="#000" stroke-opacity="0.5"/>
  <circle cx="186" cy="61" r="2.4" fill="#FF2A2A"/>
