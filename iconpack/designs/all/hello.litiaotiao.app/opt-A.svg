<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <path id="sq" d="M15 15H241V241H15Z"/>
    <clipPath id="clip"><use href="#sq"/></clipPath>
    <linearGradient id="bg" x1="0" y1="15" x2="0" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E9A76"/><stop offset="1" stop-color="#15644B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="15" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="96" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE7E3"/>
    </linearGradient>
    <linearGradient id="pgl" x1="0" y1="98" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="110" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A8E6C"/><stop offset="1" stop-color="#156048"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="130" x2="0" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE3C8"/><stop offset="1" stop-color="#F2BE92"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#062C20" flood-opacity="0.5"/></filter>
    <filter id="hsh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#062C20" flood-opacity="0.5"/></filter>
  </defs>
  <use href="#sq" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <path d="M15 15H241V112C190 96 160 92 128 92S66 96 15 112Z" fill="url(#gloss)"/>
    <use href="#sq" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="5"/>
    <use href="#sq" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" transform="translate(0 1)"/>
  </g>
  <!-- skip button -->
  <g filter="url(#sh)">
    <rect x="36" y="94" width="184" height="66" rx="33" fill="url(#pill)"/>
  </g>
  <rect x="42" y="98" width="172" height="30" rx="15" fill="url(#pgl)" opacity="0.7"/>
  <text x="112" y="141" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-weight="700" font-size="40" fill="url(#txt)">跳过</text>
  <path d="M170 112L186 127L170 142" fill="none" stroke="url(#txt)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tapping finger -->
  <g filter="url(#hsh)" transform="translate(158 140) rotate(-18) scale(0.72)">
    <path d="M14 0C22 0 28 6 28 14V52C32 46 44 46 48 54C54 50 64 52 66 62C72 60 82 64 82 74V104C82 128 66 142 44 142H34C18 142 8 132 2 118L-18 74C-22 64 -12 56 -4 62L0 66V14C0 6 6 0 14 0Z" fill="url(#hand)" stroke="#D9A274" stroke-width="2"/>
    <path d="M28 52V78M48 54V80M66 62V84" stroke="#D9A274" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- tap ripple -->
  <circle cx="166" cy="146" r="14" fill="none" stroke="#fff" stroke-opacity="0.0"/>
</svg>
