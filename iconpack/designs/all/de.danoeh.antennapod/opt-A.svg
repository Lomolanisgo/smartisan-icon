<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rim" x1="0" y1="10" x2="0" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DCE6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="20" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EB5F7"/>
      <stop offset="1" stop-color="#1560DE"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="20" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#062E73" flood-opacity="0.5"/>
    </filter>
    <filter id="os" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#rim)" filter="url(#os)"/>
  <circle cx="128" cy="128" r="106" fill="url(#blue)"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#0B3F9E" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M24 120 C28 64 74 22 128 22 C182 22 228 64 232 120 C198 100 164 92 128 92 C92 92 58 100 24 120 Z" fill="url(#gloss)"/>
  <clipPath id="disc"><circle cx="128" cy="128" r="105"/></clipPath>
  <!-- whole tower group shifted +22 so the top circle (was cy 106) sits exactly on the badge centre (128,128); legs clipped by the disc -->
  <g clip-path="url(#disc)"><g transform="translate(0 22)" filter="url(#sh)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#DCEFFF" stroke-width="12" opacity="0.8">
      <path d="M102.8 142 A44 44 0 1 1 153.2 142"/>
      <path d="M86.7 165 A72 72 0 1 1 169.3 165"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="13">
      <path d="M92 210 L128 118 L164 210"/>
      <path d="M108 172 H148"/>
    </g>
    <circle cx="128" cy="106" r="17" fill="#FFFFFF" stroke="none"/>
  </g></g>
</svg>
