<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="tile" cx="0.4" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f5f2"/>
      <stop offset="1" stop-color="#e4e1dc"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bdb9b3"/>
    </linearGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="150" y1="58" x2="110" y2="200">
      <stop offset="0" stop-color="#f0505a"/>
      <stop offset="0.3" stop-color="#e03476"/>
      <stop offset="0.62" stop-color="#a042c8"/>
      <stop offset="1" stop-color="#4270e6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- engraved: inner shadow top + light lip at bottom -->
    <filter id="eng" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#3a1030" flood-opacity="0.75"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="2.6"/>
      <feOffset dy="4.5" result="ish"/>
      <feComposite in="ish" in2="SourceAlpha" operator="in" result="inner"/>
      <feOffset in="SourceAlpha" dy="1.6" result="lo"/>
      <feComposite in="lo" in2="SourceAlpha" operator="out" result="lip0"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="lip0" operator="in" result="lip"/>
      <feMerge><feMergeNode in="lip"/><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="26" y="24" width="204" height="204" rx="42" fill="url(#rim)"/>
    <rect x="28" y="26" width="200" height="200" rx="40" fill="url(#tile)"/>
  </g>
  <rect x="40" y="38" width="176" height="176" rx="32" fill="none" stroke="#000" stroke-opacity="0.04" stroke-width="1.5"/>
  <g transform="translate(12 16)" filter="url(#eng)">
    <path fill="url(#note)" d="M100 68 L170 50 L170 150 A25 19 -22 1 1 159 131 L159 76 L111 88 L111 164 A25 19 -22 1 1 100 145 Z"/>
  </g>
</svg>
