    <radialGradient id="kY" cx="0.38" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#F2A100"/></radialGradient>
    <radialGradient id="kP" cx="0.38" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFB3C6"/><stop offset="1" stop-color="#F0527C"/></radialGradient>
