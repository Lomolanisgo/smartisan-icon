    <rect x="107.5" y="90" width="18" height="13" rx="4" fill="none" stroke-width="3.2"/>
    <rect x="130.5" y="90" width="18" height="13" rx="4" fill="none" stroke-width="3.2"/>
    <path d="M125.5 95H130.5" stroke-width="2.5"/>
    <circle cx="117" cy="97" r="2.2" fill="#111111" stroke="none"/>
    <circle cx="139" cy="97" r="2.2" fill="#111111" stroke="none"/>
    <!-- nose -->
    <path d="M128 102V110" fill="none" stroke-width="2.4"/>
    <!-- moustache + goatee -->
    <path d="M106 120C114 110 124 112 128 115C132 112 142 110 150 120C144 126 138 126 135 125C136 134 133 142 128 148C123 142 120 134 121 125C118 126 112 126 106 120Z" fill="#FFFFFF" stroke-width="3"/>
    <path d="M123 124Q128 128 133 124" fill="none" stroke-width="2.2"/>
