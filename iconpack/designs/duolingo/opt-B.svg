<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECE6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE83F"/>
      <stop offset="1" stop-color="#5DBA10"/>
    </linearGradient>
    <radialGradient id="eyeW" cx="0.45" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F4F7F2"/>
      <stop offset="1" stop-color="#D9E3D2"/>
    </radialGradient>
    <linearGradient id="pupil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="beakT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="beakB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1A"/>
      <stop offset="1" stop-color="#E86F00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2F6B00" flood-opacity="0.35"/>
    </filter>
    <filter id="duoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="-1" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="tileClip"><rect x="8" y="22" width="240" height="212" rx="18"/></clipPath>
  </defs>

  <!-- light tile -->
  <rect x="8" y="22" width="240" height="212" rx="18" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="8.5" y="22.5" width="239" height="211" rx="17.5" fill="none" stroke="#fff" stroke-width="1"/>

  <g clip-path="url(#tileClip)">
    <!-- faint green ground line -->
    <rect x="8" y="196" width="240" height="40" fill="#DDEFCB"/>
    <!-- Duo rising from the bottom edge -->
    <g filter="url(#duoShadow)">
      <!-- head/body -->
      <path fill="url(#body)" d="M40 250 V130 C40 88 70 66 128 66 C186 66 216 88 216 130 V250 Z"/>
      <!-- tufts -->
      <rect x="-10" y="-28" width="20" height="38" rx="10" fill="#94E63B" transform="translate(116,74) rotate(-32)"/>
      <rect x="-9" y="-24" width="18" height="32" rx="9" fill="#94E63B" transform="translate(99,78) rotate(-58)"/>
      <rect x="-10" y="-28" width="20" height="38" rx="10" fill="#94E63B" transform="translate(140,74) rotate(32)"/>
      <rect x="-9" y="-24" width="18" height="32" rx="9" fill="#94E63B" transform="translate(157,78) rotate(58)"/>
    </g>
    <path fill="url(#gloss)" d="M52 128 C52 94 80 76 128 76 C176 76 204 94 204 128 C170 112 86 112 52 128 Z" opacity="0.7"/>
    <!-- belly -->
    <ellipse cx="128" cy="236" rx="56" ry="40" fill="#CDEF97"/>
    <!-- wing tips gripping the edge -->
    <ellipse cx="46" cy="214" rx="16" ry="22" fill="#6BC41A" filter="url(#soft)" transform="rotate(-18 46 214)"/>
    <ellipse cx="210" cy="214" rx="16" ry="22" fill="#6BC41A" filter="url(#soft)" transform="rotate(18 210 214)"/>
  </g>

  <!-- eyes -->
  <g filter="url(#soft)">
    <ellipse cx="94" cy="136" rx="30" ry="34" fill="url(#eyeW)"/>
    <ellipse cx="162" cy="136" rx="30" ry="34" fill="url(#eyeW)"/>
  </g>
  <rect x="92" y="117" width="22" height="36" rx="11" fill="url(#pupil)"/>
  <rect x="142" y="117" width="22" height="36" rx="11" fill="url(#pupil)"/>
  <circle cx="98" cy="126" r="6" fill="#fff"/>
  <circle cx="148" cy="126" r="6" fill="#fff"/>

  <!-- beak -->
  <g filter="url(#soft)">
    <rect x="115" y="166" width="26" height="30" rx="13" fill="url(#beakB)"/>
    <path fill="url(#beakT)" d="M104 176 C107 164 117 157 128 157 C139 157 149 164 152 176 C152 178 151 179 149 179 L128 183 L107 179 C105 179 104 178 104 176 Z"/>
  </g>
  <path d="M122 160 C125 159 131 159 134 160 C137 161 138 164 136 166 H120 C118 164 119 161 122 160 Z" fill="#FFF1A0" opacity="0.9"/>
</svg>
