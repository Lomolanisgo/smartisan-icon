  <!-- subtle printed info block (simplified weight table) -->
  <g opacity="0.85">
    <rect x="34" y="168" width="64" height="7" fill="#D40511"/>
    <g fill="#fff" fill-opacity="0.75">
      <rect x="34" y="178" width="30" height="4"/><rect x="68" y="178" width="30" height="4"/>
      <rect x="34" y="185" width="30" height="4"/><rect x="68" y="185" width="30" height="4"/>
      <rect x="34" y="192" width="30" height="4"/><rect x="68" y="192" width="30" height="4"/>
    </g>
    <rect x="178" y="192" width="44" height="5" rx="1" fill="#D40511" fill-opacity="0.8"/>
