<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="leather" x1="0" y1="66" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24B07F"/>
      <stop offset="0.45" stop-color="#138C66"/>
      <stop offset="1" stop-color="#0A5E46"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="26" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A8A63"/>
      <stop offset="1" stop-color="#084D3A"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="66" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DDD8"/>
    </linearGradient>
    <radialGradient id="g" cx="128" cy="112" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48CF98"/>
      <stop offset="1" stop-color="#0B7A5E"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#002A1F" flood-opacity="0.5"/>
    </filter>
    <filter id="ground" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="232" rx="104" ry="7" fill="#000" opacity="0.25" filter="url(#ground)"/>
  <!-- handle -->
  <path fill="url(#handle)" fill-rule="evenodd"
    d="M84 80 V50 C84 34 94 26 110 26 H146 C162 26 172 34 172 50 V80 Z M100 80 V52 C100 45 104 42 111 42 H145 C152 42 156 45 156 52 V80 Z"/>
  <rect x="78" y="62" width="18" height="16" rx="3" fill="#C9A45A"/>
  <rect x="160" y="62" width="18" height="16" rx="3" fill="#C9A45A"/>
  <!-- body -->
  <rect x="16" y="70" width="224" height="160" rx="22" fill="url(#leather)"/>
  <rect x="16" y="70" width="224" height="160" rx="22" fill="none" stroke="#063E2E" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M38 70 H218 C231 70 240 79 240 92 V132 H16 V92 C16 79 25 70 38 70 Z" fill="url(#flap)"/>
  <!-- seam + stitching -->
  <path d="M16 132 H240" stroke="#063E2E" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M16 134.5 H240" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
  <rect x="26" y="80" width="204" height="140" rx="14" fill="none" stroke="#E7F5EE" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- bubble badge (clasp) -->
  <g filter="url(#sh)">
    <g fill="url(#rim)">
      <circle cx="132" cy="140" r="46"/>
      <path d="M96 162 L82 196 L120 184 Z"/>
    </g>
    <g fill="url(#g)">
      <circle cx="132" cy="140" r="38"/>
      <path d="M102 166 L94 186 L118 176 Z"/>
    </g>
    <path fill="#FFFFFF" fill-rule="evenodd" transform="translate(132 140) scale(0.44) translate(-136 -124)"
      d="M100 72 H138 C158 72 168 84 168 100 C168 110 163 117 154 121 C165 125 172 133 172 146 C172 164 159 176 138 176 H100 Z
         M119 89 V115 H135 C144 115 149 110 149 102 C149 94 144 89 135 89 Z
         M119 131 V159 H137 C147 159 153 154 153 145 C153 136 147 131 137 131 Z"/>
  </g>
