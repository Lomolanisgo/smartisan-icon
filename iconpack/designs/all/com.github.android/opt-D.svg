<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 官方 GitHub 标志路径 = 圆盘减去猫；用 mask 反求出猫本身 -->
    <path id="gh" d="M22,0.5C9.845,0.5 0,10.3646 0,22.5438C0,32.2982 6.2975,40.5371 15.0425,43.4579C16.1425,43.6508 16.555,42.9895 16.555,42.4108C16.555,41.8873 16.5275,40.1513 16.5275,38.3051C11,39.3247 9.57,36.955 9.13,35.715C8.8825,35.0812 7.81,33.1248 6.875,32.6013C6.105,32.188 5.005,31.1685 6.8475,31.1409C8.58,31.1134 9.8175,32.7391 10.23,33.4004C12.21,36.7345 15.3725,35.7977 16.6375,35.219C16.83,33.7862 17.4075,32.8217 18.04,32.2707C13.145,31.7196 8.03,29.8183 8.03,21.3865C8.03,18.9893 8.8825,17.0053 10.285,15.4622C10.065,14.9111 9.295,12.6517 10.505,9.6206C10.505,9.6206 12.3475,9.042 16.555,11.8801C18.315,11.3841 20.185,11.1361 22.055,11.1361C23.925,11.1361 25.795,11.3841 27.555,11.8801C31.7625,9.0144 33.605,9.6206 33.605,9.6206C34.815,12.6517 34.045,14.9111 33.825,15.4622C35.2275,17.0053 36.08,18.9617 36.08,21.3865C36.08,29.8458 30.9375,31.7196 26.0425,32.2707C26.84,32.9595 27.5275,34.2822 27.5275,36.3488C27.5275,39.2971 27.5,41.6668 27.5,42.4108C27.5,42.9895 27.9125,43.6783 29.0125,43.4579C37.7025,40.5371 44,32.2707 44,22.5438C44,10.3646 34.155,0.5 22,0.5Z"/>
    <mask id="catMask" maskUnits="userSpaceOnUse" x="-5" y="-5" width="60" height="60">
      <circle cx="22" cy="22.5" r="21.7" fill="#fff"/>
      <use href="#gh" fill="#000"/>
    </mask>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5F66"/>
      <stop offset="0.4" stop-color="#2E3238"/>
      <stop offset="1" stop-color="#15171A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1012"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.25"/></filter>
  </defs>
  <!-- 猫高约 224，居中略偏上 -->
  <g transform="translate(-8.5 -48) scale(6.5)">
    <g mask="url(#catMask)">
      <!-- 地面投影 -->
      <circle cx="22" cy="24.3" r="21.7" fill="#000" fill-opacity="0.35" filter="url(#shadow)"/>
    </g>
    <!-- 厚度 -->
    <g mask="url(#catMask)" transform="translate(0 1.3)"><circle cx="22" cy="22.5" r="21.7" fill="url(#side)"/></g>
    <g mask="url(#catMask)" transform="translate(0 0.7)"><circle cx="22" cy="22.5" r="21.7" fill="#1C1F23"/></g>
    <!-- 正面 -->
    <g mask="url(#catMask)">
      <circle cx="22" cy="22.5" r="21.7" fill="url(#face)"/>
      <!-- 上半釉面反光 -->
      <rect x="0" y="8" width="44" height="12" fill="url(#gloss)"/>
      <!-- 上沿窄高光：把标志路径描白边，只露出猫内侧 -->
      <use href="#gh" transform="translate(0 0.35)" fill="none" stroke="#C9CED6" stroke-width="0.45" stroke-opacity="0.9" filter="url(#soft)"/>
      <!-- 内侧暗边 -->
      <use href="#gh" fill="none" stroke="#000" stroke-width="1.4" stroke-opacity="0.35" filter="url(#soft)"/>
    </g>
    <!-- 猫的外轮廓浅色描边（深色桌面上保证可见） -->
    <g mask="url(#catMask)">
      <use href="#gh" fill="none" stroke="#8C9198" stroke-width="0.3" stroke-opacity="0.9"/>
    </g>
  </g>
</svg>
