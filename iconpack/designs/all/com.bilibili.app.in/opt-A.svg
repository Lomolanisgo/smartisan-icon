    <clipPath id="wClip"><use href="#w"/></clipPath>

    <!-- 正面：上亮下深的 bilibili 粉 -->
    <linearGradient id="face" x1="0" y1="84" x2="0" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA3C0"/>
      <stop offset="0.4" stop-color="#FB7BA1"/>
      <stop offset="0.8" stop-color="#F5608D"/>
      <stop offset="1" stop-color="#E4497B"/>
    </linearGradient>
    <!-- 侧面厚度 -->
    <linearGradient id="side" x1="0" y1="84" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C94A76"/>
      <stop offset="1" stop-color="#9A3159"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="84" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 模糊值按 scale 1.24 换算：5px≈4，3px≈2.4，1.4px≈1.1 -->
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <!-- 文字标志宽约 240，居中略偏上；厚度 6px（4.8 单位），投影偏移 10px -->
  <g transform="translate(-29.65 -37.5) scale(1.24)">
    <!-- 地面投影 -->
    <use href="#w" transform="translate(0 8)" fill="#000" fill-opacity="0.32" filter="url(#shadow)"/>
    <!-- 厚度：向下挤出（多层叠加，斜笔画不留台阶） -->
    <g fill="url(#side)">
      <use href="#w" transform="translate(0 4.8)"/>
      <use href="#w" transform="translate(0 4.0)"/>
      <use href="#w" transform="translate(0 3.2)"/>
      <use href="#w" transform="translate(0 2.4)"/>
      <use href="#w" transform="translate(0 1.6)"/>
      <use href="#w" transform="translate(0 0.8)"/>
    </g>
    <!-- 正面与侧面交界暗线 -->
    <use href="#w" fill="none" stroke="#A8385F" stroke-opacity="0.6" stroke-width="0.9"/>
    <!-- 正面 -->
    <use href="#w" fill="url(#face)"/>
    <g clip-path="url(#wClip)">
      <!-- 内侧柔和暗边 -->
      <use href="#w" fill="none" stroke="#D84E7C" stroke-opacity="0.35" stroke-width="2.6" filter="url(#innerBlur)"/>
      <use href="#w" transform="translate(0 -1.2)" fill="none" stroke="#C3406E" stroke-opacity="0.45" stroke-width="1.4" filter="url(#softBlur)"/>
      <!-- 上沿窄高光 -->
      <use href="#w" transform="translate(0 1.4)" fill="none" stroke="#FFE4EC" stroke-opacity="1" stroke-width="1.6" filter="url(#softBlur)"/>
      <!-- 上半部釉面反光 -->
      <rect x="28" y="84" width="200" height="44" fill="url(#gloss)"/>
    </g>
    <!-- 外轮廓细描边 -->
    <use href="#w" fill="none" stroke="#B23C64" stroke-opacity="0.55" stroke-width="0.5"/>
  </g>
</svg>
