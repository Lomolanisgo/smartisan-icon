      <stop offset="0" stop-color="#F07A74"/><stop offset="0.5" stop-color="#D2474A"/><stop offset="1" stop-color="#9A2328"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="12" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eng" x1="0" y1="60" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6E3DE"/>
    </linearGradient>
    <filter id="osh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
