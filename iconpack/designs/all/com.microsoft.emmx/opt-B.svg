<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 2019 版 Edge 旋涡标志：三段官方路径（256 坐标系；手机图标为位图，路径按官方矢量重建并与位图叠合校对） -->
    <path id="p1" d="M235.68 195.46a93.73 93.73 0 0 1-10.54 4.71 101.87 101.87 0 0 1-35.9 6.46c-47.32 0-88.54-32.55-88.54-74.32a31.48 31.48 0 0 1 16.43-27.31c-42.8 1.8-53.8 46.4-53.8 72.53 0 73.88 68.09 81.37 82.76 81.37 7.91 0 19.84-2.3 27-4.56l1.31-.44A128.34 128.34 0 0 0 241 197.06a4 4 0 0 0-5.32-1.6z"/>
    <path id="p2" d="M105.73 241.42a79.2 79.2 0 0 1-22.74-21.35 80.72 80.72 0 0 1 29.53-120c3.16-1.49 8.55-4.18 15.71-4.06a32.68 32.68 0 0 1 25.95 13.13 32.14 32.14 0 0 1 6.36 18.86c0-.21 24.5-79.63-80-79.63-43.87 0-80 41.63-80 78.14a130.34 130.34 0 0 0 12.13 56 128 128 0 0 0 156.38 67.11 75.56 75.56 0 0 1-63.24-8.14z"/>
    <path id="p3" d="M152.75 148.85c-.83 1.05-3.34 2.51-3.34 5.69 0 2.62 1.71 5.15 4.74 7.27 14.48 10.07 41.77 8.74 41.84 8.74a60 60 0 0 0 30.5-8.4 61.83 61.83 0 0 0 30.66-53.29c.27-22.6-8.07-37.62-11.43-44.27C224.3 22.86 178.36 0 128 0A128 128 0 0 0 0 126.2c.48-36.5 36.76-66 80-66 3.5 0 23.46.34 42 10.07 16.34 8.58 24.9 18.94 30.85 29.21 6.18 10.67 7.28 24.15 7.28 29.52s-2.73 13.33-7.38 19.85z"/>
    <g id="all"><use href="#p3"/><use href="#p2"/><use href="#p1"/></g>
    <clipPath id="c1"><use href="#p1"/></clipPath>
    <clipPath id="c2"><use href="#p2"/></clipPath>
    <clipPath id="c3"><use href="#p3"/></clipPath>

    <!-- 顶部青绿段 -->
    <linearGradient id="f3" x1="20" y1="30" x2="250" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD6F6"/><stop offset=".3" stop-color="#35C1F1"/><stop offset=".55" stop-color="#2BC3C2"/><stop offset=".8" stop-color="#36C752"/><stop offset="1" stop-color="#6BEC6F"/>
    </linearGradient>
    <linearGradient id="s3" x1="20" y1="30" x2="250" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A8FBF"/><stop offset=".55" stop-color="#178E90"/><stop offset="1" stop-color="#1E8A3A"/>
    </linearGradient>
    <!-- 中段蓝 -->
    <linearGradient id="f2" x1="0" y1="60" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FB0F0"/><stop offset=".4" stop-color="#1B9DE2"/><stop offset="1" stop-color="#0072CC"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B63B0"/><stop offset="1" stop-color="#084E8E"/>
    </linearGradient>
    <!-- 底部深蓝 -->
    <linearGradient id="f1" x1="60" y1="120" x2="240" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C59A4"/><stop offset="1" stop-color="#134E93"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#083D78"/><stop offset="1" stop-color="#062C58"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="5.5"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- 直径约 228，居中略偏上 -->
  <g transform="translate(14 8) scale(0.89)">
    <!-- 地面投影 -->
    <use href="#all" transform="translate(0 12)" fill="#000" fill-opacity=".32" filter="url(#shadow)"/>

    <!-- 顶部青绿段：厚度 + 正面 -->
    <use href="#p3" transform="translate(0 8)" fill="url(#s3)"/>
    <use href="#p3" transform="translate(0 4)" fill="url(#s3)" opacity=".8"/>
    <use href="#p3" fill="url(#f3)"/>
    <g clip-path="url(#c3)">
      <use href="#p3" fill="none" stroke="#0E6F86" stroke-width="16" stroke-opacity=".32" filter="url(#innerBlur)"/>
      <use href="#p3" transform="translate(0 3.2)" fill="none" stroke="#F2FFFF" stroke-width="5" stroke-opacity=".9" filter="url(#softBlur)"/>
      <ellipse cx="128" cy="44" rx="120" ry="52" fill="url(#gloss)" opacity=".6"/>
    </g>

    <!-- 中段蓝：厚度 + 正面 -->
    <use href="#p2" transform="translate(0 8)" fill="url(#s2)"/>
    <use href="#p2" transform="translate(0 4)" fill="url(#s2)" opacity=".8"/>
    <use href="#p2" fill="url(#f2)"/>
    <g clip-path="url(#c2)">
      <use href="#p2" fill="none" stroke="#0A4E9A" stroke-width="16" stroke-opacity=".38" filter="url(#innerBlur)"/>
      <use href="#p2" transform="translate(0 3.2)" fill="none" stroke="#DFF3FF" stroke-width="5" stroke-opacity=".7" filter="url(#softBlur)"/>
      <ellipse cx="70" cy="110" rx="60" ry="48" fill="url(#gloss)" opacity=".35"/>
    </g>

    <!-- 底部深蓝：厚度 + 正面 -->
    <use href="#p1" transform="translate(0 8)" fill="url(#s1)"/>
    <use href="#p1" transform="translate(0 4)" fill="url(#s1)" opacity=".8"/>
    <use href="#p1" fill="url(#f1)"/>
    <g clip-path="url(#c1)">
      <!-- 卷入内侧的暗部 -->
      <use href="#p1" fill="none" stroke="#04244F" stroke-width="18" stroke-opacity=".45" filter="url(#innerBlur)"/>
      <ellipse cx="100" cy="150" rx="60" ry="50" fill="#03203F" opacity=".5" filter="url(#innerBlur)"/>
      <use href="#p1" transform="translate(0 3)" fill="none" stroke="#9CCBFF" stroke-width="4" stroke-opacity=".6" filter="url(#softBlur)"/>
    </g>

    <!-- 外轮廓细线（深色桌面上保住轮廓） -->
    <use href="#all" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>
    <!--BADGE-->
  </g>
</svg>
