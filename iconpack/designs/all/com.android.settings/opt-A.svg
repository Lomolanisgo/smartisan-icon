  <circle cx="128" cy="128" r="116" fill="url(#ring)" filter="url(#dsh)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="128" cy="128" r="103" fill="url(#face)"/>
  <circle cx="128" cy="128" r="103" fill="none" stroke="#000" stroke-opacity="0.10" stroke-width="1.5"/>
  <g filter="url(#sh)"><use href="#gear" fill="url(#metal)"/></g>
