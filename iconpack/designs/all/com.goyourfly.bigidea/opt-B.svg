    <rect x="0" y="44" width="256" height="2" fill="#4E3C5E" opacity="0.35"/>
    <rect x="0" y="46" width="256" height="5" fill="#000" opacity="0.06"/>
    <use href="#tile" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="5"/>
    <use href="#tile" fill="none" stroke="#fff" stroke-width="2" transform="translate(0 1)" stroke-opacity="0.6"/>
    <use href="#tile" fill="none" stroke="#C9C0AE" stroke-width="2"/>
