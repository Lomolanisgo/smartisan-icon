<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Uber · 圆形 A：黑色釉面圆（直径 248）+ 白色 Uber 字标（现行官方配色） -->
  <defs>
    <radialGradient id="ball" cx="96" cy="52" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3B40"/><stop offset="0.45" stop-color="#16171A"/><stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8C93" stop-opacity="0.8"/><stop offset="0.5" stop-color="#000" stop-opacity="0.3"/><stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="100" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E4E8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="128" cy="128" r="124"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#ball)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="28" rx="150" ry="96" fill="url(#gloss)"/>
    <circle cx="128" cy="128" r="123" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>
  <text x="128" y="128" dominant-baseline="central" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="66" letter-spacing="-1.5" fill="url(#ink)" filter="url(#drop)">Uber</text>
</svg>
