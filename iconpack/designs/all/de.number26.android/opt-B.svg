<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FDCCB"/><stop offset="0.28" stop-color="#4DB09B"/><stop offset="0.5" stop-color="#7ACDBB"/><stop offset="0.75" stop-color="#3A9884"/><stop offset="1" stop-color="#2D7D6C"/>
    </linearGradient>
    <pattern id="brush" width="256" height="3" patternUnits="userSpaceOnUse">
      <rect width="256" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0B5"/><stop offset="0.5" stop-color="#D8AE4E"/><stop offset="1" stop-color="#F3D98A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="206" rx="104" ry="14" fill="url(#contact)"/>
  <g transform="rotate(-10 128 128)">
    <g filter="url(#sh)">
      <rect x="12" y="58" width="232" height="146" rx="14" fill="url(#metal)"/>
    </g>
    <rect x="12" y="58" width="232" height="146" rx="14" fill="url(#brush)"/>
    <rect x="12" y="58" width="232" height="146" rx="14" fill="url(#gloss)"/>
    <rect x="12.75" y="58.75" width="230.5" height="144.5" rx="13.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- chip -->
    <rect x="36" y="104" width="40" height="31" rx="6" fill="url(#chip)" stroke="#9C7A2A" stroke-opacity="0.6"/>
    <path d="M36 114H50M36 125H50M62 114H76M62 125H76M50 104V135M62 104V135" stroke="#9C7A2A" stroke-opacity="0.55" stroke-width="1.2" fill="none"/>
    <!-- contactless -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round">
      <path d="M90 110a14 14 0 0 1 0 20"/><path d="M98 104a24 24 0 0 1 0 32"/>
    </g>
    <!-- N26 wordmark -->
    <g fill="#FFFFFF">
      <rect x="130" y="146" width="24" height="3.5"/>
      <rect x="130" y="189" width="24" height="3.5"/>
      <text x="129" y="184" font-family="Segoe UI, sans-serif" font-weight="300" font-size="44" textLength="26" lengthAdjust="spacingAndGlyphs">N</text>
      <text x="157" y="184" font-family="Segoe UI, sans-serif" font-weight="300" font-size="44">26</text>
    </g>
  </g>
</svg>
