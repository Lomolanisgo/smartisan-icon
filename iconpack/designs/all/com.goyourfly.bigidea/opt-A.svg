<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFBE0"/>
      <stop offset="0.35" stop-color="#FFE27A"/>
      <stop offset="0.8" stop-color="#FDBB2F"/>
      <stop offset="1" stop-color="#E89A10"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE27A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B557E"/>
      <stop offset="0.3" stop-color="#B59CC8"/>
      <stop offset="0.55" stop-color="#8C72A2"/>
      <stop offset="1" stop-color="#5A456C"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6A4A00" flood-opacity="0.35"/></filter>
    <filter id="rs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-opacity="0.3"/></filter>
  </defs>
  <circle cx="128" cy="104" r="100" fill="url(#halo)"/>
  <!-- rays -->
  <g stroke-linecap="round" stroke-width="13" filter="url(#rs)">
    <line x1="128" y1="10" x2="128" y2="28" stroke="#9C78C8"/>
    <line x1="194" y1="38" x2="206" y2="26" stroke="#C0609E"/>
    <line x1="222" y1="104" x2="240" y2="104" stroke="#E0607A"/>
    <line x1="196" y1="170" x2="210" y2="184" stroke="#E0506A"/>
    <line x1="62" y1="38" x2="50" y2="26" stroke="#7470D8"/>
