  <path d="M100 196 C132 222 186 218 216 186 C214 200 206 210 196 216 C166 234 120 228 100 196 Z" fill="#1A8A6C" stroke="#0D5443" stroke-width="1.5"/>
  <path d="M146 156 C130 146 106 152 94 174 C90 182 86 192 82 200 C94 196 104 194 116 194 C136 192 152 176 146 156 Z" fill="url(#head)" stroke="#1E8E70" stroke-width="1.2"/>
  <circle cx="126" cy="170" r="4" fill="#0C1A16"/>
  <circle cx="125" cy="168.8" r="1.3" fill="#fff" opacity="0.85"/>
