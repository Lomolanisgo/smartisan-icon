      <rect x="156" y="46" width="2" height="186"/><rect x="180" y="46" width="2" height="186"/>
    </g>
    <!-- label plate behind logo -->
    <rect x="54" y="46" width="148" height="30" fill="#fff" opacity=".10"/>
  </g>
  <rect x="55" y="47" width="146" height="184" rx="23" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
