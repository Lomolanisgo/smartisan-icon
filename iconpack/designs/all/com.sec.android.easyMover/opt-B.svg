<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="oldBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AA1AC"/><stop offset="0.4" stop-color="#E7EAEE"/><stop offset="1" stop-color="#A5ACB7"/></linearGradient>
    <linearGradient id="oldScr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6272"/><stop offset="1" stop-color="#2A2F38"/></linearGradient>
    <linearGradient id="newBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A3E4C"/><stop offset="0.5" stop-color="#1C1E27"/><stop offset="1" stop-color="#343846"/></linearGradient>
    <linearGradient id="newScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CB0FF"/><stop offset="0.55" stop-color="#4C62F2"/><stop offset="1" stop-color="#4A1CE4"/></linearGradient>
    <linearGradient id="arr" x1="50" y1="0" x2="190" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6BB6FF"/><stop offset="1" stop-color="#5A2BEA"/></linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- old phone -->
  <g filter="url(#ds)" transform="rotate(-8 70 160)">
    <rect x="26" y="86" width="88" height="152" rx="15" fill="url(#oldBody)"/>
    <rect x="26.5" y="86.5" width="87" height="151" rx="14.5" fill="none" stroke="#7B828D" stroke-opacity="0.6"/>
    <rect x="33" y="100" width="74" height="122" rx="6" fill="url(#oldScr)"/>
    <rect x="58" y="92" width="24" height="3" rx="1.5" fill="#7B828D"/>
    <circle cx="70" cy="230" r="4" fill="none" stroke="#7B828D" stroke-width="1.5"/>
    <path d="M33 100H107V132L33 170Z" fill="#FFFFFF" opacity="0.08"/>
  </g>
  <!-- new phone -->
  <g filter="url(#ds)">
    <rect x="126" y="64" width="104" height="180" rx="18" fill="url(#newBody)"/>
    <rect x="127" y="65" width="102" height="178" rx="17" fill="none" stroke="#6A7082" stroke-opacity="0.8"/>
    <rect x="133" y="72" width="90" height="164" rx="11" fill="url(#newScr)"/>
    <circle cx="178" cy="80" r="3" fill="#0D0E14"/>
    <path d="M133 72H223V112L133 188Z" fill="#FFFFFF" opacity="0.1"/>
    <!-- progress -->
    <rect x="148" y="206" width="60" height="7" rx="3.5" fill="#FFFFFF" opacity="0.3"/>
    <rect x="148" y="206" width="40" height="7" rx="3.5" fill="#FFFFFF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M178 124V168M160 152L178 170L196 152"/>
    </g>
  </g>
  <!-- arrow -->
  <g filter="url(#ds)">
    <path d="M58 84Q88 20 160 34" fill="none" stroke="url(#arr)" stroke-width="18" stroke-linecap="round"/>
    <path d="M154 54L168 14L194 42Z" fill="url(#arr)" stroke="url(#arr)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M64 70Q92 30 150 34" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
