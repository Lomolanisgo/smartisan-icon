  <!-- teal leather wallet body -->
  <g filter="url(#sh)">
    <rect x="4" y="42" width="248" height="194" rx="26" fill="url(#leather)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="4" y="42" width="248" height="194" fill="#000" filter="url(#grain)" opacity="0.10"/>
    <rect x="4" y="42" width="248" height="40" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="4" y="42" width="248" height="194" rx="26" fill="none" stroke="#1F7571" stroke-width="3"/>
    <rect x="4" y="44" width="248" height="194" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <rect x="13" y="51" width="230" height="176" rx="18" fill="none" stroke="#1E6E6A" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="13" y="52.5" width="230" height="176" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- snap tab -->
  <g filter="url(#sh)">
    <path d="M252,102 H222 C207,102 196,113 196,128 V136 C196,151 207,162 222,162 H252 Z" fill="url(#tab)"/>
  </g>
  <path d="M252,102.8 H222 C207.5,102.8 197,113.5 197,128" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
