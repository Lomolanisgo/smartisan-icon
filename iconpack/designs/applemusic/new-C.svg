<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eeeef1"/>
      <stop offset="1" stop-color="#c4c5cb"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9abb2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="base" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f1f1f4"/>
      <stop offset="1" stop-color="#d9dae0"/>
    </radialGradient>
    <pattern id="mesh" width="7" height="12.124" patternUnits="userSpaceOnUse">
      <g fill="#ffffff">
        <circle cx="0" cy="0.7" r="2.5"/><circle cx="7" cy="0.7" r="2.5"/><circle cx="3.5" cy="6.762" r="2.5"/><circle cx="0" cy="12.824" r="2.5"/><circle cx="7" cy="12.824" r="2.5"/>
      </g>
      <g fill="#9a9ca6" opacity="0.55">
        <circle cx="0" cy="0" r="2.4"/><circle cx="7" cy="0" r="2.4"/><circle cx="3.5" cy="6.062" r="2.4"/><circle cx="0" cy="12.124" r="2.4"/><circle cx="7" cy="12.124" r="2.4"/>
      </g>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#303040" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="150" y1="58" x2="110" y2="200">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.3" stop-color="#f53a7e"/>
      <stop offset="0.62" stop-color="#b54ad8"/>
      <stop offset="1" stop-color="#4f7cf7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
    <clipPath id="nc"><path transform="translate(128 129) scale(1.12) translate(-116 -117)" d="M100 68 L170 50 L170 150 A25 19 -22 1 1 159 131 L159 76 L111 88 L111 164 A25 19 -22 1 1 100 145 Z"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lsh" x="-30%" y="-30%" width="160%" height="160%">
