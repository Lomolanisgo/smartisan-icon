    <path id="logo" d="M89.83 29.14L86.50 30.24L84.17 31.83L83.12 32.83L81.19 35.83L80.39 38.50L80.17 40.17L80.05 56.83L79.77 58.17L79.03 59.17L78.19 59.83L76.83 60.53L75.50 60.92L59.50 60.98L56.50 61.25L53.83 62.43L51.81 64.17L50.23 66.17L49.15 68.83L48.98 72.50L49.08 83.83L50.23 86.83L51.83 88.94L54.17 90.78L55.83 91.63L56.83 91.92L73.83 92.04L75.50 92.23L77.60 93.17L79.02 94.50L79.83 95.68L80.12 97.50L80.18 119.17L79.94 121.17L79.17 122.38L77.50 123.61L76.17 123.97L58.83 124.00L56.83 124.21L54.50 125.20L52.73 126.50L51.32 127.83L50.03 129.83L49.22 131.83L49.01 133.17L49.00 145.50L49.16 147.17L50.20 149.830L51.70 151.83L53.83 153.66L56.50 154.86L60.17 155.22L70.17 155.15L72.83 154.78L75.83 153.25L76.83 152.42L78.50 150.40L79.86 147.50L80.11 131.17L81.17 128.12L82.50 126.27L83.83 125.10L85.17 124.34L86.17 124.06L101.83 123.87L102.83 123.71L105.41 122.83L107.83 121.25L108.99 120.17L110.81 117.50L111.73 114.83L111.94 112.50L111.82 101.50L110.61 98.17L108.50 95.38L105.50 93.33L101.83 92.26L87.50 92.15L84.50 91.91L83.17 91.19L81.78 89.83L81.17 88.91L80.26 86.83L80.06 84.83L80.10 68.17L80.35 66.83L81.15 64.83L82.34 63.17L83.50 62.11L85.83 61.05L88.50 60.88L101.17 60.84L102.50 60.63L105.17 59.82L107.50 58.53L108.95 57.17L110.82 54.50L111.86 51.50L111.99 48.50L111.88 38.50L110.83 35.41L108.81 32.50L107.50 31.41L105.57 30.17L102.50 29.16ZM120.17 61.10L117.50 62.11L115.50 63.55L113.36 66.17L112.27 68.50L112.01 70.17L112.00 82.17L112.10 83.83L112.39 84.83L113.17 86.52L115.17 89.15L117.37 90.83L119.17 91.73L121.17 92.00L136.83 92.10L137.83 92.31L139.78 93.17L141.48 94.50L142.87 96.50L143.44 99.50L143.45 117.50L143.00 119.83L142.55 120.83L141.12 122.50L138.83 123.81L137.50 123.99L120.50 124.10L117.83 125.10L115.44 126.83L113.30 129.50L112.38 131.50L112.12 132.50L112.00 144.17L112.13 146.83L113.17 149.54L115.17 152.22L117.17 153.78L119.50 154.82L123.83 155.22L132.17 155.21L135.50 154.91L138.17 153.75L139.83 152.49L141.58 150.50L142.83 147.83L143.24 144.17L143.30 130.17L144.03 127.50L144.80 126.17L145.50 125.35L146.67 124.50L148.17 124.00L163.83 123.910L165.83 123.76L168.83 122.74L171.50 120.90L172.74 119.50L173.79 117.83L174.88 114.83L175.00 111.50L174.88 101.17L173.78 98.17L172.36 96.17L171.17 94.97L168.17 93.12L165.50 92.35L164.17 92.18L147.50 92.04L146.17 91.70L145.17 90.84L144.11 89.50L143.33 86.83L143.30 72.17L142.91 68.50L141.50 65.45L140.43 64.17L138.83 62.76L135.83 61.30L134.83 61.05L124.17 60.96ZM28.83 92.16L26.83 92.32L23.50 93.35L20.42 95.50L18.25 98.50L17.24 101.50L17.10 104.17L17.16 113.83L17.40 115.17L18.20 117.50L19.99 120.17L21.17 121.26L23.50 122.81L26.50 123.79L38.50 123.88L39.83 123.70L42.50 122.76L45.26 120.83L46.49 119.50L47.80 117.17L48.69 114.17L48.84 112.17L48.83 103.13L48.59 101.50L47.76 98.83L46.62 96.83L45.50 95.53L43.72 94.17L41.83 93.11L38.17 92.20Z"/>
    <!-- charcoal cabinet front -->
    <linearGradient id="cab" x1="0" y1="24" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5E64"/><stop offset="0.5" stop-color="#3E4247"/><stop offset="1" stop-color="#2A2D31"/>
    </linearGradient>
    <!-- recessed bezel around the tube -->
    <linearGradient id="bezel" x1="0" y1="34" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16181B"/><stop offset="1" stop-color="#34383D"/>
    </linearGradient>
    <!-- screen: red CCTV glow, darker toward the corners like a CRT -->
    <radialGradient id="screen" cx="122" cy="96" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3A4B"/><stop offset="0.6" stop-color="#D40617"/><stop offset="1" stop-color="#7A0009"/>
    </radialGradient>
    <!-- silver lower panel -->
    <linearGradient id="silver" x1="0" y1="180" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F3F5"/><stop offset="0.45" stop-color="#C9CDD2"/><stop offset="1" stop-color="#9EA3A9"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="220" x2="0" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2D31"/><stop offset="1" stop-color="#15171A"/>
    </linearGradient>
    <!-- curved-glass reflection (Trinitron tubes are cylindrical: flat vertically, curved horizontally) -->
    <linearGradient id="glassH" x1="36" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="glassV" x1="0" y1="42" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sc"><path id="tube" d="M50 44H206C214 44 218 47 219 55C221 80 221 142 219 160C218 167 214 170 206 170H50C42 170 38 167 37 160C35 142 35 80 37 55C38 47 42 44 50 44Z"/></clipPath>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fff" flood-opacity="0.7"/>
    </filter>
    <pattern id="grille" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#3B3F44" fill-opacity="0.75"/>
    </pattern>
  </defs>

  <!-- stand -->
  <path d="M70 218H186L194 240H62Z" fill="url(#stand)"/>
  <rect x="62" y="238" width="132" height="4" rx="2" fill="#0E1012"/>

  <!-- cabinet -->
  <rect x="4" y="24" width="248" height="198" rx="16" fill="url(#cab)" filter="url(#ds)"/>
  <rect x="4.75" y="24.75" width="246.5" height="196.5" rx="15.25" fill="none" stroke="#7A7F86" stroke-width="1.5"/>
  <rect x="7" y="27" width="242" height="192" rx="13" fill="none" stroke="#000" stroke-opacity="0.35"/>

  <!-- silver lower panel with speaker grilles and controls -->
  <path d="M8 180H248V206C248 214 244 218 236 218H20C12 218 8 214 8 206Z" fill="url(#silver)"/>
  <path d="M8 180.5H248" stroke="#FFFFFF" stroke-opacity="0.8"/>
  <rect x="18" y="188" width="72" height="22" rx="3" fill="url(#grille)"/>
  <rect x="166" y="188" width="72" height="22" rx="3" fill="url(#grille)"/>
  <!-- centre controls: power button + small keys + red standby lamp -->
  <rect x="104" y="191" width="22" height="14" rx="3" fill="#E6E8EB" stroke="#8E949A"/>
  <rect x="132" y="194" width="8" height="8" rx="1.5" fill="#D5D8DC" stroke="#8E949A" stroke-width="0.8"/>
  <rect x="144" y="194" width="8" height="8" rx="1.5" fill="#D5D8DC" stroke="#8E949A" stroke-width="0.8"/>
  <circle cx="98" cy="198" r="2.2" fill="#FF2A2A"/>

  <!-- tube bezel + screen -->
  <rect x="26" y="34" width="204" height="146" rx="12" fill="url(#bezel)"/>
  <rect x="26.5" y="34.5" width="203" height="145" rx="11.5" fill="none" stroke="#000" stroke-opacity="0.5"/>
  <use href="#tube" fill="url(#screen)"/>
  <g clip-path="url(#sc)">
    <g transform="translate(125 111) scale(0.66) translate(-96 -92)" fill="#fff" filter="url(#glow)">
      <use href="#logo"/>
    </g>
    <!-- scanlines -->
    <g stroke="#000" stroke-opacity="0.07" stroke-width="1">
      <path d="M30 50H226M30 57H226M30 64H226M30 71H226M30 78H226M30 85H226M30 92H226M30 99H226M30 106H226M30 113H226M30 120H226M30 127H226M30 134H226M30 141H226M30 148H226M30 155H226M30 162H226"/>
    </g>
    <rect x="30" y="40" width="196" height="134" fill="url(#glassH)"/>
    <path d="M30 40H226V78C170 70 100 74 30 92Z" fill="url(#glassV)"/>
  </g>
  <use href="#tube" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
