<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="ring" x1="0" y1="8" x2="0" y2="196" gradientUnits="userSpaceOnUse">
