<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#e9e9eb"/>
    </linearGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="150" y1="58" x2="110" y2="200">
      <stop offset="0" stop-color="#ff6a55"/>
      <stop offset="0.28" stop-color="#f43d7c"/>
      <stop offset="0.6" stop-color="#b24ada"/>
      <stop offset="1" stop-color="#4a7df8"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="150" y1="58" x2="110" y2="200">
      <stop offset="0" stop-color="#c8283a"/>
      <stop offset="0.6" stop-color="#7a2aa8"/>
      <stop offset="1" stop-color="#2a4fc0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nc"><path d="M100 68 L170 50 L170 150 A25 19 -22 1 1 159 131 L159 76 L111 88 L111 164 A25 19 -22 1 1 100 145 Z"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nsh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dx="1" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="10" y="32" width="236" height="192" rx="20" fill="#c9cacd"/>
    <rect x="11.2" y="33.2" width="233.6" height="189.6" rx="18.8" fill="url(#tile)"/>
  </g>
  <rect x="13" y="34.5" width="230" height="4" rx="2" fill="#fff" opacity="0.9"/>
  <g transform="translate(12 12)">
    <g filter="url(#nsh)">
      <path fill="url(#note)" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round" d="M100 68 L170 50 L170 150 A25 19 -22 1 1 159 131 L159 76 L111 88 L111 164 A25 19 -22 1 1 100 145 Z"/>
    </g>
    <g clip-path="url(#nc)">
      <path d="M40 40 L200 40 L200 60 L100 86 L100 130 Q80 140 60 170 L40 170 Z" fill="url(#gloss)" opacity="0.55"/>
      <ellipse cx="80" cy="152" rx="14" ry="5" transform="rotate(-22 80 152)" fill="#fff" opacity="0.55"/>
      <ellipse cx="139" cy="138" rx="14" ry="5" transform="rotate(-22 139 138)" fill="#fff" opacity="0.55"/>
      <path d="M103 71 L167 54" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
