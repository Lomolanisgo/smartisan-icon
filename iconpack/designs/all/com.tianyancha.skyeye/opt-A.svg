  <circle cx="128" cy="127" r="116" fill="url(#rim)" filter="url(#osh)"/>
  <circle cx="128" cy="128" r="103" fill="#9AA6B6" opacity="0.5"/>
  <circle cx="128" cy="129" r="101" fill="url(#face)"/>
