<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Uber · 圆形 B：白色陶瓷圆（直径 248，锤子原图的材质）+ 黑色 Uber 字标 -->
  <defs>
    <radialGradient id="ball" cx="100" cy="56" r="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F1F1F2"/><stop offset="1" stop-color="#D2D3D6"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#BDBEC2"/><stop offset="1" stop-color="#9FA1A6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="100" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2B2F"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-40%" width="140%" height="180%">
      <feOffset in="SourceAlpha" dy="1.5"/><feGaussianBlur stdDeviation="0.6"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/><feComposite operator="in" in2="SourceGraphic" result="x"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.85"/>
      <feComposite in2="SourceAlpha" operator="in"/><feOffset dy="1.5" result="hi"/>
      <feMerge><feMergeNode in="hi"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="128" cy="128" r="124"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#ball)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="30" rx="140" ry="90" fill="url(#gloss)" opacity="0.6"/>
    <circle cx="128" cy="128" r="123" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="119" fill="none" stroke="#000" stroke-opacity="0.05" stroke-width="3"/>
  </g>
  <text x="128" y="128" dominant-baseline="central" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="66" letter-spacing="-1.5" fill="url(#ink)" filter="url(#emboss)">Uber</text>
</svg>
