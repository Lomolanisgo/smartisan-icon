<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 央视频 · T：Trinitron 风格显像管电视——深灰机身正面、微弧屏幕、银色底部面板带扬声器格栅和按键；
       屏幕里是 B 方案的白色央视频标志。不加品牌字样。机身宽 248（x 4–252）。 -->
