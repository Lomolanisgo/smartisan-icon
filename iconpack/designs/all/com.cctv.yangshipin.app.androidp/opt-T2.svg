    </linearGradient>
    <radialGradient id="screen" cx="98" cy="112" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3A4B"/><stop offset="0.6" stop-color="#D40617"/><stop offset="1" stop-color="#6E0008"/>
    </radialGradient>
