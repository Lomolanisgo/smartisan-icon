<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rim" x1="0" y1="12" x2="0" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E2E6EC"/><stop offset="1" stop-color="#B8C0CC"/>
    </linearGradient>
    <radialGradient id="face" cx="128" cy="70" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#F3F6FA"/><stop offset="1" stop-color="#DCE3EC"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="40" x2="0" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BA4FF"/><stop offset="1" stop-color="#0066E0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="30" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="osh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#003A8C" flood-opacity="0.35"/></filter>
