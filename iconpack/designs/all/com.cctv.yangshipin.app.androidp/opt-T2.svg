    <!-- brushed silver-grey front -->
    <linearGradient id="front" x1="0" y1="44" x2="0" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9BBBD"/><stop offset="0.5" stop-color="#9C9EA1"/><stop offset="1" stop-color="#7E8184"/>
    </linearGradient>
    <pattern id="brush" width="256" height="3" patternUnits="userSpaceOnUse">
