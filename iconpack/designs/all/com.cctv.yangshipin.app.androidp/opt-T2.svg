    <!-- walnut side panels -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A3E16"/><stop offset="0.45" stop-color="#B8672C"/><stop offset="1" stop-color="#8A4A1C"/>
    </linearGradient>
    <pattern id="grain" width="14" height="40" patternUnits="userSpaceOnUse">
