  </g>
  <!-- engraved shadow + raised silver logo -->
  <use href="#logo" fill="#000" opacity="0.6" transform="translate(0 3)"/>
  <use href="#logo" fill="#fff" opacity="0.25" transform="translate(0 -1)"/>
  <use href="#logo" fill="url(#silver)"/>
