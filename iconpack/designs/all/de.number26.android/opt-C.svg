  <!-- copper outline rectangle crossing the band -->
  <rect x="158" y="61" width="88" height="66" rx="4" fill="none" stroke="#C88E6C" stroke-width="2.2"/>
  <rect x="158" y="62" width="88" height="66" rx="4" fill="none" stroke="#FFE1CC" stroke-width="0.6" opacity="0.5"/>

  <!-- chip -->
  <rect x="24" y="112" width="36" height="30" rx="5" fill="url(#chip)" stroke="#8D9298" stroke-width="0.8"/>
  <path d="M24 122H36M24 132H36M48 122H60M48 132H60M36 112V142M48 112V142M36 127H48" stroke="#8D9298" stroke-width="0.9" fill="none"/>
  <!-- contactless -->
  <g fill="none" stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round">
    <path d="M72 121a8 8 0 0 1 0 12"/><path d="M78 116a15 15 0 0 1 0 22"/><path d="M84 111a22 22 0 0 1 0 32"/>
  </g>

  <!-- debit hologram disc -->
  <circle cx="220" cy="128" r="17" fill="url(#holo)"/>
  <circle cx="220" cy="128" r="17" fill="url(#rainbow)"/>
  <circle cx="220" cy="128" r="16.4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>

  <!-- embossed number, simplified to groups -->
  <g fill="#3A3A3A">
    <rect x="24" y="156" width="40" height="7" rx="2"/>
    <rect x="72" y="156" width="40" height="7" rx="2"/>
    <rect x="120" y="156" width="40" height="7" rx="2"/>
    <rect x="168" y="156" width="40" height="7" rx="2"/>
  </g>
  <g fill="#FFFFFF" opacity="0.7">
    <rect x="24" y="163" width="40" height="1"/><rect x="72" y="163" width="40" height="1"/>
    <rect x="120" y="163" width="40" height="1"/><rect x="168" y="163" width="40" height="1"/>
  </g>

  <!-- Mastercard -->
  <circle cx="207" cy="182" r="15" fill="#EB001B"/>
  <circle cx="228" cy="182" r="15" fill="#F79E1B"/>
  <circle cx="228" cy="182" r="15" fill="#FF5F00" clip-path="url(#red)"/>

  <!-- card edge: highlight + thin rim -->
  <rect x="4.75" y="50.75" width="246.5" height="154.5" rx="13.3" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  <rect x="4" y="50" width="248" height="156" rx="14" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M10,205.5 H246" stroke="#000" stroke-opacity="0.15" stroke-width="1"/>
</svg>
