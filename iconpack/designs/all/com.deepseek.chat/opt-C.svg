    <clipPath id="wClip"><use href="#w"/></clipPath>

    <!-- 正面：上亮下深的 DeepSeek 蓝 -->
    <linearGradient id="face" x1="0" y1="135" x2="0" y2="403" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FB2FF"/><stop offset="0.35" stop-color="#6683FF"/><stop offset="0.75" stop-color="#4A66F6"/><stop offset="1" stop-color="#3350E4"/>
    </linearGradient>
    <!-- 厚度 -->
    <linearGradient id="side" x1="0" y1="135" x2="0" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E44C4"/><stop offset="1" stop-color="#1C2C96"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="240" cy="190" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <filter id="innerBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <!-- 鲸鱼宽约 234，居中略偏上 -->
  <g transform="translate(128 121) scale(0.66) translate(-263 -269)">
    <!-- 地面投影 -->
    <use href="#w" transform="translate(0 16)" fill="#000" fill-opacity="0.3" filter="url(#shadow)"/>
    <!-- 厚度：向下挤出约 7px -->
    <use href="#w" transform="translate(0 11)" fill="url(#side)"/>
    <!-- 厚度下沿的浅色边线，让深色桌面上仍有轮廓 -->
    <use href="#w" transform="translate(0 11)" fill="none" stroke="#7F93F0" stroke-width="2" stroke-opacity="0.55"/>
    <use href="#w" transform="translate(0 6)" fill="#2B41C0"/>
    <!-- 正面 -->
    <use href="#w" fill="url(#face)"/>
    <g clip-path="url(#wClip)">
      <!-- 内侧暗边 -->
      <use href="#w" fill="none" stroke="#2237AE" stroke-width="16" stroke-opacity="0.42" filter="url(#innerBlur)"/>
      <use href="#w" fill="none" stroke="#3A54DE" stroke-width="6" stroke-opacity="0.35" filter="url(#softBlur)"/>
      <!-- 上沿窄高光 -->
      <use href="#w" transform="translate(0 4)" fill="none" stroke="#E4EBFF" stroke-width="5" stroke-opacity="0.9" filter="url(#softBlur)"/>
      <!-- 背部釉面反光与光斑 -->
      <ellipse cx="215" cy="215" rx="140" ry="52" fill="url(#gloss)"/>
      <rect x="80" y="130" width="370" height="150" fill="url(#spec)"/>
    </g>
    <!-- 外轮廓浅色细边（深色桌面上的轮廓保障） -->
    <use href="#w" fill="none" stroke="#C9D5FF" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
