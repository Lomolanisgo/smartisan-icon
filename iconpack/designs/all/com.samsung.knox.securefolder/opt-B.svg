    <clipPath id="sqClip"><use href="#sq"/></clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EA6FF"/><stop offset="1" stop-color="#3C25DE"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A68D8"/><stop offset="1" stop-color="#2410A0"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E94FF"/><stop offset="1" stop-color="#4230E0"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C3CAD6"/><stop offset="1" stop-color="#8F99AA"/></linearGradient>
    <linearGradient id="silverR" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C3CAD6"/><stop offset="1" stop-color="#8F99AA"/></linearGradient>
    <radialGradient id="dial" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stop-color="#4E4BF0"/><stop offset="1" stop-color="#22168F"/></radialGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5DEFA"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
