<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1531C9"/><stop offset=".2" stop-color="#2E52FF"/>
      <stop offset=".55" stop-color="#4A6BFF"/><stop offset=".85" stop-color="#2346FF"/><stop offset="1" stop-color="#1127A8"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5F68"/><stop offset="1" stop-color="#23262B"/>
    </linearGradient>
    <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4EAFF"/>
    </linearGradient>
    <radialGradient id="dot" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFE9A3"/><stop offset=".45" stop-color="#FFB400"/><stop offset="1" stop-color="#D98300"/>
    </radialGradient>
    <clipPath id="bc"><rect x="54" y="46" width="148" height="186" rx="24"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="emb" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
      <feOffset in="b" dy="2" result="o"/>
      <feFlood flood-color="#000D55" flood-opacity=".5"/><feComposite in2="o" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- telescopic handle -->
  <path d="M96 50V22Q96 12 106 12H150Q160 12 160 22V50H148V26Q148 24 146 24H110Q108 24 108 26V50Z" fill="url(#handle)"/>
