    <clipPath id="tileClip"><use href="#tile"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDFBF4"/>
      <stop offset="1" stop-color="#F1EBDD"/>
    </linearGradient>
    <linearGradient id="bind" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
