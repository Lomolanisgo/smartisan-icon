<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- DHL wordmark: official path from Wikimedia Commons File:DHL_Logo.svg, uniform scale 1.0470 -->
  <defs>
    <path id="body" d="M20 50C20 45 23 42 28 42H228C233 42 236 45 236 50V212C236 217 233 220 228 220H28C23 220 20 217 20 212Z"/>
    <path id="flap" d="M20 50C20 45 23 42 28 42H228C233 42 236 45 236 50V82C236 85 234 87 231 87H25C22 87 20 85 20 82Z"/>
    <clipPath id="bc"><use href="#body"/></clipPath>
    <linearGradient id="paper" x1="0" y1="42" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD21A"/><stop offset="0.55" stop-color="#FFCC00"/><stop offset="1" stop-color="#F0B400"/>
    </linearGradient>
    <linearGradient id="flapG" x1="0" y1="42" x2="0" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE56E"/><stop offset="0.6" stop-color="#FFD62A"/><stop offset="1" stop-color="#F5C400"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="200" x2="0" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D99E00"/><stop offset="1" stop-color="#B98200"/>
    </linearGradient>
    <linearGradient id="side" x1="20" y1="0" x2="236" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.07"/><stop offset="0.12" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="6.965" x2="0" y2="31.819" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4002B"/><stop offset="1" stop-color="#C60024"/>
    </linearGradient>
    <radialGradient id="shadow" cx="128" cy="228" r="120" gradientUnits="userSpaceOnUse" gradientTransform="matrix(1 0 0 0.11 0 203)">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.35" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0  0 0 0 0.15 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="flapShadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#7A5200" flood-opacity="0.45"/>
    </filter>
    <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="0.478" stdDeviation="0.239" flood-color="#7A5A00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="226" rx="120" ry="12" fill="url(#shadow)"/>
  <!-- paper thickness: back sheet peeking out at bottom/right -->
  <path d="M22 54C22 49 25 46 30 46H229C234 46 238 49 238 54V215C238 221 235 224 229 224H30C25 224 22 221 22 215Z" fill="url(#edge)"/>
  <use href="#body" fill="url(#paper)"/>
  <g clip-path="url(#bc)">
    <rect x="0" y="0" width="256" height="256" fill="#000" filter="url(#fiber)"/>
    <rect x="20" y="42" width="216" height="178" fill="url(#side)"/>
    <!-- bottom seam -->
    <path d="M20 207H236" stroke="#C99A00" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M20 208.5H236" stroke="#FFF1A8" stroke-opacity="0.5" stroke-width="1"/>
    <!-- gentle bulge highlight -->
    <path d="M20 120C80 104 176 104 236 120V150C176 136 80 136 20 150Z" fill="#FFF3B0" opacity="0.12"/>
  </g>
  <use href="#body" fill="none" stroke="#FFF4B8" stroke-opacity="0.7" stroke-width="1.5" transform="translate(0 1)" clip-path="url(#bc)"/>
  <use href="#body" fill="none" stroke="#B88600" stroke-opacity="0.55" stroke-width="1"/>
  <!-- top closing flap with its own shadow -->
  <use href="#flap" fill="url(#flapG)" filter="url(#flapShadow)"/>
  <g clip-path="url(#bc)">
    <path d="M28 64H228" stroke="#C99A00" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="5 3"/>
    <path d="M22 44.5H234" stroke="#FFF6C8" stroke-opacity="0.9" stroke-width="1.5"/>
  </g>
  <path d="M21 85.5H235" stroke="#FFF1A0" stroke-opacity="0.8" stroke-width="1"/>
  <!-- tear tab -->
  <path d="M200 42H222V60C222 62 221 63 219 63H203C201 63 200 62 200 60Z" fill="#F2BE00" stroke="#C99A00" stroke-opacity="0.5" stroke-width="1"/>
