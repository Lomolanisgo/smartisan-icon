      <stop offset="1" stop-color="#F7AE20"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#8A7A5A" opacity="0.08"/><circle cx="4" cy="4" r="0.5" fill="#8A7A5A" opacity="0.06"/></pattern>
  </defs>
  <use href="#tile" fill="url(#paper)"/>
  <g clip-path="url(#tileClip)">
