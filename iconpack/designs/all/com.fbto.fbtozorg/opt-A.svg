    <linearGradient id="fill" x1="0" y1="23" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E8CF5"/><stop offset="1" stop-color="#05B2F6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="44" x2="0" y2="100" gradientUnits="userSpaceOnUse">
