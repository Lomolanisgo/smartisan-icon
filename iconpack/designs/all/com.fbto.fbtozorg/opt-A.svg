    </g>
    <text x="73" y="85" font-family="Segoe UI Black, Segoe UI, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="-1" fill="#10357A">FBT</text>
    <g transform="rotate(-90 163 71)" fill="none" stroke-width="7.5">
      <circle cx="163" cy="71" r="12.5" stroke="#E4003B" stroke-dasharray="19.7 58.9"/>
      <circle cx="163" cy="71" r="12.5" stroke="#FFA300" stroke-dasharray="19.7 58.9" stroke-dashoffset="-19.6"/>
