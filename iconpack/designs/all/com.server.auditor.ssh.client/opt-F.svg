    <linearGradient id="body" x1="0" y1="15" x2="0" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4E58"/><stop offset="0.5" stop-color="#30333B"/><stop offset="1" stop-color="#1C1E23"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="34" x2="0" y2="200" gradientUnits="userSpaceOnUse">
